<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600&display=swap">
<style>
/* Layout: uma coluna de leitura (~68ch) sob cabeçalho fixo com abas; a passagem é o único cartão destacado de cada tela */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#132038; --muted:#526079; --line:#D4DCE7;
  --accent:#1550A6; --accent-ink:#FFFFFF; --accent-soft:#E4EDF9; --accent2:#0F8F7E;
  --grad:linear-gradient(120deg,#0B3A85 0%,#1673C6 55%,#17A98F 100%);
  --mark:#F6DF7C; --ok:#1E8458; --bad:#B9412D;
  --v1:#1550A6; --v2:#A86A12; --v3:#0F8F7E; --v4:#9A3B63;
  --sombra:0 1px 2px rgba(19,32,56,.06),0 4px 14px rgba(19,32,56,.06);
  --f-ui:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --read-size:1.125rem; --read-lh:1.75; --read-ls:0em; --read-w:68ch;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1424; --surface:#131D31; --ink:#E5ECF6; --muted:#9BAAC2; --line:#263552;
  --accent:#78AEF2; --accent-ink:#081224; --accent-soft:#182A4B; --accent2:#4FD1B8;
  --grad:linear-gradient(120deg,#2C64C2 0%,#2B8FE0 55%,#2BC0A3 100%);
  --mark:#5A4C10; --ok:#5CCB94; --bad:#F08A73;
  --v1:#78AEF2; --v2:#E0A84A; --v3:#4FD1B8; --v4:#E08AB0; --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0C1424; --surface:#131D31; --ink:#E5ECF6; --muted:#9BAAC2; --line:#263552;
  --accent:#78AEF2; --accent-ink:#081224; --accent-soft:#182A4B; --accent2:#4FD1B8;
  --grad:linear-gradient(120deg,#2C64C2 0%,#2B8FE0 55%,#2BC0A3 100%);
  --mark:#5A4C10; --ok:#5CCB94; --bad:#F08A73;
  --v1:#78AEF2; --v2:#E0A84A; --v3:#4FD1B8; --v4:#E08AB0; --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark; }

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:46rem;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px 8px}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.lio-logo{height:40px;width:auto;border-radius:8px;flex:none}
.lio-hero{width:min(260px,70%);height:auto;border-radius:14px;align-self:flex-start}
.brand small{display:block;font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem;padding:4px 8px;border:1px solid var(--line);border-radius:6px;min-width:4.2em;text-align:center}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:600 .88rem var(--f-ui);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .n{font-family:var(--f-mono);font-weight:500;margin-right:4px;color:var(--accent)}

main{padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.6rem;line-height:1.2;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:1.15rem;margin:0;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);max-width:62ch}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{font:600 .92rem var(--f-ui);border-radius:8px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,nav.tabs button:focus-visible,.opt:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.passage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;font-family:var(--f-read);font-size:var(--read-size);line-height:var(--read-lh);letter-spacing:var(--read-ls);max-width:var(--read-w)}
.passage p+p{margin-top:.8em}
.passage .label{font-family:var(--f-ui);font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block}
.hiddenbox{border:1px dashed var(--line);border-radius:10px;padding:18px 22px;color:var(--muted);font-style:italic;font-family:var(--f-read)}
mark.core{background:var(--mark);color:var(--ink);padding:0 2px;border-radius:2px}
sup.fn{font-family:var(--f-mono);color:var(--accent);font-weight:500}

.q{font-weight:600;font-size:1rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:400 1rem/1.45 var(--f-read);padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.opt:disabled{cursor:default}
.fb{font-size:.95rem;padding:12px 14px;border-radius:8px;background:var(--accent-soft)}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}

.field label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.field select{width:100%;font:1rem var(--f-ui);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.field input{width:100%;font:1rem var(--f-read);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:10px}
.choice{text-align:left;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px;min-width:0}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.choice b{font-size:.95rem} .choice span{font-size:.84rem;color:var(--muted)}

.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .84rem var(--f-ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--accent)} .steps i.now{background:var(--ink)}
.steps.nav{gap:2px;align-items:center}
.steps.nav button{border:0;background:none;padding:9px 1px;margin:0;cursor:pointer;display:inline-flex;border-radius:4px}
.steps.nav button i{transition:height .12s}
.steps.nav button:hover i,.steps.nav button:focus-visible i{height:10px}
.steps.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.steps.nav button.fim i{width:12px;border-radius:50%;height:12px;background:none;border:2px solid var(--line)}
.steps.nav button.fim.now i{border-color:var(--ink)}
.navpar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.navpar .note{margin:0}
.secinteira .sh{font-family:var(--f-ui);font-weight:700;font-size:1rem;margin:1.2em 0 .4em}
.secinteira .pgsep{display:block;font-family:var(--f-ui);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:1.1em 0 .4em;border-top:1px dashed var(--line);padding-top:.5em}
.secinteira .sp{margin:0 0 .8em;padding:4px 8px;margin-left:-8px;margin-right:-8px;border-radius:6px;cursor:pointer;border-left:3px solid transparent}
.secinteira .sp:hover{background:var(--accent-soft)}
.secinteira .sp.atual{background:var(--accent-soft);border-left-color:var(--accent)}
.secinteira .sp.q{padding-left:2em}
.secinteira .sp .pn{font-family:var(--f-ui);font-size:.7rem;font-weight:700;color:var(--muted);margin-right:6px}
.secinteira .sp .ok{font-family:var(--f-ui);font-size:.7rem;color:var(--accent);margin-left:4px}

.orderlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.orderlist li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.orderlist .txt{flex:1;min-width:0;font-family:var(--f-read);line-height:1.5}
.orderlist .pos{font-family:var(--f-mono);color:var(--muted);min-width:1.4em}
.orderlist .mv{display:flex;flex-direction:column;gap:4px}
.orderlist li.right{border-color:var(--ok)} .orderlist li.wrong{border-color:var(--bad)}
.yr{font-family:var(--f-mono);font-weight:500;color:var(--accent);margin-right:6px}

.claim{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:8px}
.claim .t{font-family:var(--f-read)}
.claim .res{font-size:.88rem}
.v-autor{--vc:var(--v1)} .v-b{--vc:var(--v2)} .v-c{--vc:var(--v3)} .v-d{--vc:var(--v4)}
.seg{background:color-mix(in srgb,var(--vc) 16%,transparent);border-bottom:2px solid var(--vc)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--vc);margin-right:6px;vertical-align:-1px}

.roles{display:flex;gap:4px;flex-wrap:wrap}
.roles .chip{font-size:.78rem;padding:4px 10px}

table{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.pill.up{color:var(--ok)} .pill.keep{color:var(--muted)} .pill.down{color:var(--bad)}
.banner{background:var(--mark);color:var(--ink);padding:10px 16px;font-weight:600;font-size:.9rem}
.note{font-size:.84rem;color:var(--muted)}
.score{font-family:var(--f-mono);font-size:2.2rem;font-weight:500;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.chip{transition:border-color .15s,background .15s}}

/* ---- Estudo ---- */
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:600 .88rem var(--f-ui);cursor:pointer;align-self:flex-start}
.linkbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:12px;padding:36px 16px;text-align:center;cursor:pointer;background:var(--surface)}
.drop.over,.drop:hover{border-color:var(--accent)}
.drop b{font-size:1.05rem}
.studyrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding-block:14px;border-top:1px solid var(--line)}
.sr-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 16rem}
.sr-main b{font-size:1rem}
.panel{border:1px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--accent-soft)}
textarea{width:100%;font:.95rem/1.55 var(--f-read);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:8rem;resize:vertical}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.field textarea{min-height:6rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:10px}
.passage.q{border-left:4px solid var(--v3);font-style:italic}
.subtitle{font-family:var(--f-ui);font-weight:700;font-size:.95rem;color:var(--muted)}
.skel{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-family:var(--f-read);max-width:68ch}
.skel .sk-h{font-family:var(--f-ui);font-weight:700;margin-top:6px}
.pgref{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);margin-right:6px;white-space:nowrap}
details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
summary{cursor:pointer;font-weight:600;font-size:.9rem}
details[open] summary{margin-bottom:8px}
details .note-t{font-family:var(--f-read);font-size:.92rem;line-height:1.55}
details .note-t+.note-t{margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);z-index:10;font-size:.9rem;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.pill.prog{color:var(--accent)}
.relcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:10px}
.relcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.relcard p{font-family:var(--f-read);font-size:.95rem}
.resumo{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-family:var(--f-read)}
.argview{display:flex;flex-direction:column;gap:10px}
.argview .role{font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.argview p{font-family:var(--f-read)}
.gloss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.gloss li{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:8px}
.gloss .gt{flex:1;min-width:0;font-family:var(--f-read)}
.fich{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;font-family:var(--f-read);line-height:1.6;max-width:72ch;display:flex;flex-direction:column;gap:10px}
.fich h2{font-family:var(--f-ui);font-size:1.1rem;margin-top:14px}
.fich h3{font-family:var(--f-ui);font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.fich ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;vertical-align:-1px;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.9s linear infinite}}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---- Leitura acessível, revisão ---- */
:root[data-paleta="sepia"][data-paleta]{--bg:#F2EADA;--surface:#FBF6EB;--ink:#3A2E21;--muted:#6B5D4B;--line:#DACCB3;--accent:#76571C;--accent-ink:#FFFFFF;--accent-soft:#EEE2CA;--mark:#F0D27B;--ok:#4B772C;--bad:#A13F28;color-scheme:light}
:root[data-paleta="contraste"][data-paleta]{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#000000;--muted:#1A1A1A;--line:#000000;--accent:#0030C0;--accent-ink:#FFFFFF;--accent-soft:#E3EAFF;--mark:#FFE600;--ok:#00661C;--bad:#B00000;color-scheme:light}
:root[data-paleta="contraste-escuro"][data-paleta]{--bg:#000000;--surface:#0A0A0A;--ink:#FFFFFF;--muted:#E8E8E8;--line:#FFFFFF;--accent:#80D4FF;--accent-ink:#000000;--accent-soft:#0B2A3A;--mark:#6E5F00;--ok:#5CFF8A;--bad:#FF8A80;color-scheme:dark}
.pnl{border-top:1px solid var(--line);background:var(--bg);max-height:70vh;overflow:auto}
.pnl .wrap{padding-block:14px 18px;display:flex;flex-direction:column;gap:14px}
.pnl-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pnl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:14px}
.pnl-item{display:flex;flex-direction:column;gap:6px;min-width:0}
.pnl-lbl{font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-style:normal;letter-spacing:normal}
::highlight(lendo){background-color:var(--mark);color:var(--ink)}
.passage.foco{color:color-mix(in srgb,var(--ink) 40%,var(--surface))}
::highlight(foco){color:var(--ink);background-color:color-mix(in srgb,var(--mark) 55%,transparent)}
.passage.cartao blockquote{margin:8px 0 0;padding-left:12px;border-left:3px solid var(--accent);font-style:italic}
.passage.cartao.verso{border-color:var(--accent)}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.notas{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:8px}
.notas .btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.notas .btn small{font-weight:400;font-size:.78rem;opacity:.85}
.panel.apoio{border-color:var(--v3);background:color-mix(in srgb,var(--v3) 8%,var(--surface))}

.edg{background:var(--surface)}
.edg>summary{font-size:1rem}
.edit{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:8px}
.edit.off{opacity:.45}
.edit .inc{display:flex;gap:6px;align-items:center;font-size:.85rem;font-weight:600}
.ed{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted)}
.ed input,.ed select,.ed textarea{font:.95rem var(--f-read);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:0;width:100%}
.ed textarea{min-height:3.2rem}
.banner.live{background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--accent)}
.banner .wrap.row{gap:8px;align-items:center;padding-block:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:20}
.skip:focus{left:16px;top:8px}

/* ---- Refinamento visual LIO ---- */
body{background:var(--bg)}
header.top{border-bottom:0;box-shadow:0 1px 0 var(--line)}
header.top::after{content:"";display:block;height:3px;background:var(--grad)}
.brand-t{font-weight:700;letter-spacing:-.01em}
.lio-logo{background:#fff}
nav.tabs .ti{display:none}
nav.tabs button{border-radius:8px 8px 0 0}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* ---- Auditoria de layout (v22): medida, quebras, áreas de toque, contraste ---- */
:root{--measure:36em;--grad-ink:linear-gradient(120deg,#0B3A85 0%,#1666B5 55%,#0F7F6C 100%)}
/* quebras: sem palavra sozinha na última linha; títulos curtos equilibrados */
p,li,dd,figcaption,label,summary,.note,.lead,.mbub{text-wrap:pretty}
.eyebrow,.hcard b,th,.btn,.chip,.linkbtn{text-wrap:balance}
/* medida de leitura do texto de interface: cerca de 75 caracteres por linha */
.lead,main p.note,.pnl p.note,main p:not([class]):not(.passage p):not(.fich p):not(.relcard p):not(.argview p){max-width:var(--measure)}
.lead,.drop .note,.vazio p{text-wrap:balance}
.skel{max-width:min(62ch,100%)}
/* links de voltar: texto alinhado à esquerda quando quebra e área de clique maior sem mudar o espaço */
.linkbtn{text-align:left;padding-block:4px;margin-block:-4px}
/* detalhes: a linha do resumo inteira é clicável, com o mesmo desenho */
details{padding:0 12px}
summary{padding-block:8px}
details[open]{padding-bottom:8px}

/* caixas de seleção alinhadas ao texto */

.grid2.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.rg-leg{display:flex;flex-wrap:wrap;gap:4px 14px}.rg-leg>span{white-space:nowrap}.rg-leg .rg-k{margin-left:0}
/* contraste: texto branco só sobre fundos escuros o bastante, nos dois temas */

.rc-area{position:relative;align-self:center;max-width:100%;touch-action:none;user-select:none}
.rc-pg{display:block;max-width:100%;max-height:66vh;width:auto;height:auto;cursor:crosshair;border:1px solid var(--line);background:#fff}
.rc-sel{position:absolute;border:2px solid var(--accent);background:rgba(21,80,166,.12);pointer-events:none}
.fala{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;user-select:none}
.navpar .apagar{margin-left:auto;color:var(--muted)}
.navpar .apagar.confirma{color:var(--bad);border-color:var(--bad)}
.parecidas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:8px}
.parecidas .btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;white-space:normal;height:auto;padding:10px 12px}
.parecidas .btn.primary .note{color:inherit;opacity:.85}
.studyrow.parecida{padding-left:14px;border-left:3px solid var(--accent-soft)}
.barras{display:flex;flex-direction:column;gap:10px}
.barra{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center}
.barra .bl{display:flex;flex-direction:column;min-width:0}
.barra .bv{display:flex;align-items:center;gap:8px;min-width:0;font:600 .85rem var(--f-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.barra .bv i{display:block;height:10px;border-radius:5px;background:var(--bad);opacity:.75}
@media (max-width:560px){.barra{grid-template-columns:1fr auto}.barra .bv{grid-column:1/-1;grid-row:2}}
.sim{border-top:1px solid var(--line);padding-top:12px}
.simres{display:flex;flex-direction:column;gap:2px}
.simres b{font-size:1.35rem;font-variant-numeric:tabular-nums}
.simctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:12px}
.sl{display:flex;flex-direction:column;gap:6px;min-width:0}
.slt{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font:600 .9rem var(--f-ui)}
.slt b{margin-left:auto;font-variant-numeric:tabular-nums}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.simg{overflow-x:auto}
.simgraf{width:100%;max-width:560px;height:auto;display:block}
.simgraf text{fill:var(--muted);font:11px var(--f-ui)}
.simgraf .tit{fill:var(--ink);font-weight:600}
.simgraf .gl{stroke:var(--line);stroke-width:1}
.simgraf .ax{stroke:var(--muted);stroke-width:1.2}
.simgraf .zero{stroke:var(--muted);stroke-dasharray:3 3}
.simgraf .curva{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.simgraf .guia{stroke:var(--accent);stroke-dasharray:3 3;opacity:.6}
.simgraf .ponto{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.vplano{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.masc{display:block;height:auto;pointer-events:none;user-select:none}
.hero{grid-template-columns:auto 1fr auto}
.m-hero{width:150px;justify-self:end}
.vazio .m-vazio{flex:none;width:52px}
.cele .m-cele,.festa .m-cele{flex:none;width:56px}
.festa{display:flex;gap:12px;align-items:center}
.espera{display:flex;gap:10px;align-items:center}
.m-espera{flex:none;width:46px}
.dicabox{display:flex;gap:10px;align-items:flex-start}
.dicabox>.stack{flex:1;min-width:0}
.m-dica{flex:none;width:44px;margin-top:2px}
@media (prefers-reduced-motion:no-preference){.m-espera{animation:pensa 1.8s ease-in-out infinite}.festa .m-cele,.cele .m-cele{animation:pula .6s cubic-bezier(.2,1.4,.4,1) both}}
@keyframes pensa{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes pula{0%{transform:scale(.6) translateY(8px);opacity:0}100%{transform:none;opacity:1}}
@media (max-width:640px){.hero{grid-template-columns:1fr}.m-hero{width:110px;grid-row:1;justify-self:end;margin-bottom:-60px;position:relative;z-index:1}}
</style>
</head>

const TEXTOS=[
{titulo:"Primeiras letras no Império",periodo:"1827 – década de 1890",pars:[
 {t:"A lei de 15 de outubro de 1827 determinou que fossem criadas escolas de primeiras letras em todas as cidades, vilas e lugares mais populosos do Império. O texto legal definia o que se deveria ensinar (ler, escrever, as quatro operações, noções de geometria e a doutrina católica) e indicava o método a ser adotado. Na prática, a distância entre a norma e a realidade foi grande: faltavam professores habilitados, prédios e recursos, e muitas das escolas previstas jamais chegaram a funcionar.",
  ok:"A lei de 1827 criou um programa ambicioso que, na prática, foi pouco cumprido.",
  no:["A lei de 1827 garantiu escolas funcionando em todas as vilas do Império.","A lei de 1827 tratou sobretudo da formação de professores."]},
 {t:"O método indicado era o ensino mútuo, também chamado lancasteriano, em que alunos mais adiantados, os monitores, repassavam lições a grupos de colegas sob a supervisão de um único mestre. A promessa era de economia: um professor poderia atender a dezenas, até centenas, de crianças. Os relatórios das autoridades provinciais nas décadas seguintes, contudo, registram queixas frequentes sobre salas inadequadas, falta de material e monitores despreparados, e o método foi sendo abandonado em favor do ensino simultâneo.",
  ok:"O ensino mútuo prometia economia, mas esbarrou em limites materiais e foi sendo abandonado.",
  no:["O ensino mútuo deu certo porque dispensava o professor.","Os monitores eram professores formados em escolas normais."]},
 {t:"Com o Ato Adicional de 1834, a responsabilidade pela instrução primária e secundária passou às assembleias provinciais, enquanto o governo central manteve o ensino superior e, na Corte, também os demais níveis. Parte da historiografia leu essa descentralização como causa direta da fragilidade da escola elementar no século XIX; estudos mais recentes, baseados em fontes provinciais, matizam esse juízo e mostram iniciativas próprias de várias províncias, ainda que muito desiguais entre si.",
  ok:"A descentralização de 1834 foi vista como causa do atraso, mas estudos recentes relativizam essa leitura.",
  no:["O Ato Adicional centralizou a instrução primária no governo imperial.","A historiografia é unânime em culpar as províncias pelo atraso escolar."]},
 {t:"Nos primeiros anos da República, São Paulo criou os grupos escolares, que reuniam num mesmo prédio várias classes antes dispersas em escolas isoladas. A organização em séries, a divisão do trabalho docente e a arquitetura monumental faziam do grupo escolar uma vitrine do regime: a escola passava a ser também símbolo de modernidade e de ordem. O modelo foi copiado por outros estados nas décadas seguintes, mas conviveu por muito tempo com as escolas isoladas, que continuaram a atender a maior parte da população rural.",
  ok:"O grupo escolar simbolizou a modernidade republicana, mas não substituiu as escolas isoladas.",
  no:["Os grupos escolares eliminaram rapidamente as escolas isoladas.","Os grupos escolares surgiram no Império como escolas rurais."]}
]},
{titulo:"A Escola Nova e o Manifesto de 1932",periodo:"1932 – 1950",pars:[
 {t:"Em 1932, um grupo de intelectuais e educadores, entre eles Fernando de Azevedo, redator do texto, Anísio Teixeira e Lourenço Filho, divulgou o Manifesto dos Pioneiros da Educação Nova. O documento defendia uma escola pública, laica, gratuita e obrigatória, organizada pelo Estado segundo um plano nacional, e propunha que a educação fosse tratada como problema técnico e científico, e não como assunto de improvisação política.",
  ok:"O Manifesto defendia uma escola pública, laica e planejada com base científica.",
  no:["O Manifesto defendia que a Igreja coordenasse a educação nacional.","O Manifesto foi escrito por Anísio Teixeira contra Fernando de Azevedo."]},
 {t:"A reação mais organizada veio de intelectuais católicos, que viam na laicidade e na coeducação dos sexos uma ameaça à formação moral da juventude e à liberdade das famílias. O embate entre católicos e renovadores atravessou a década de 1930, marcou os debates da Constituinte de 1934 e ajudou a definir os limites do que o Estado podia ou não impor às escolas.",
  ok:"Católicos e renovadores disputaram o modelo de escola ao longo dos anos 1930.",
  no:["Os católicos apoiaram a laicidade proposta pelo Manifesto.","O conflito ficou restrito ao ano de 1932."]},
 {t:"Para os renovadores, o centro do processo educativo deixava de ser o programa ou o professor e passava a ser a criança, com seus interesses e fases de desenvolvimento. Daí a valorização da atividade, da experimentação e dos testes psicológicos. Críticos posteriores observaram que essa ênfase no método, ao deslocar o foco do conteúdo, podia beneficiar sobretudo as crianças que já traziam de casa o repertório cultural que a escola esperava.",
  ok:"A Escola Nova centrou-se na criança, mas críticos apontaram efeitos desiguais dessa ênfase.",
  no:["A Escola Nova reforçou a centralidade do professor e do programa.","Os críticos afirmaram que a Escola Nova beneficiou sobretudo as crianças pobres."]},
 {t:"O alcance prático do ideário escolanovista foi desigual. As experiências de Anísio Teixeira no Distrito Federal, no início da década de 1930, e mais tarde na Bahia, com o Centro Educacional Carneiro Ribeiro, tornaram-se referências. Ao mesmo tempo, a Reforma Capanema, a partir de 1942, consolidou um ensino secundário seletivo e separado do ensino profissional, em direção oposta à escola única defendida em 1932.",
  ok:"As ideias escolanovistas tiveram experiências marcantes, mas a política dos anos 1940 seguiu outra direção.",
  no:["A Reforma Capanema realizou a escola única proposta pelo Manifesto.","O escolanovismo nunca chegou a ter experiências práticas."]}
]},
{titulo:"Ensino de ciências e seus materiais",periodo:"1950 – 1980",pars:[
 {t:"No pós-guerra, o ensino de ciências ganhou espaço nos debates educacionais brasileiros, associado à ideia de que o desenvolvimento nacional dependia da formação científica da população. O Instituto Brasileiro de Educação, Ciência e Cultura, o IBECC, passou a produzir em São Paulo kits experimentais, manuais e feiras de ciências, apostando que o aluno aprenderia ciência fazendo ciência, e não apenas memorizando definições.",
  ok:"Nos anos 1950, o ensino de ciências foi ligado ao desenvolvimento e à experimentação.",
  no:["O IBECC defendia um ensino de ciências baseado na memorização.","O ensino de ciências perdeu espaço depois da guerra."]},
 {t:"Na década de 1960, projetos curriculares norte-americanos de física, biologia e química, elaborados após o lançamento do Sputnik, foram traduzidos e adaptados no Brasil. Os materiais traziam uma concepção de ciência como processo de investigação; sua adoção, contudo, esbarrava na formação dos professores e na escassez de laboratórios, sobretudo fora dos grandes centros.",
  ok:"Projetos estrangeiros trouxeram a ciência como investigação, mas encontraram limites locais.",
  no:["Os projetos estrangeiros foram rejeitados por completo no Brasil.","Os projetos foram adotados de modo uniforme em todo o país."]},
 {t:"Para enfrentar o problema da formação docente, foram criados, a partir de meados dos anos 1960, centros regionais de ensino de ciências, como o do Nordeste, sediado em Recife. Esses centros ofereciam cursos de treinamento a professores, distribuíam materiais e funcionavam como mediadores entre os projetos nacionais e as realidades das escolas de cada região.",
  ok:"Centros regionais formavam professores e faziam a mediação entre projetos e escolas.",
  no:["Os centros regionais substituíram as escolas normais.","Os centros produziam pesquisa sem contato com as escolas."]},
 {t:"Para o historiador, esses objetos (kits, manuais, cartazes, aparelhos de laboratório) não são apenas ilustrações de um currículo pensado em outro lugar. Eles registram decisões sobre o que valia a pena ensinar, como o aluno deveria agir diante do fenômeno e qual era o papel do professor. Tomá-los como fonte permite perceber a distância entre as prescrições oficiais e aquilo que efetivamente entrava na sala de aula.",
  ok:"Objetos de ensino são fontes que revelam concepções e práticas, não só ilustrações.",
  no:["Objetos escolares servem apenas para ilustrar o currículo oficial.","Os kits mostram que as prescrições oficiais eram seguidas fielmente."]}
]}
];

  ok:"A escola primária maranhense tornou-se o principal alvo das reformas.",

 {f:"[[O método do ensino mútuo]], que chegou ao Brasil por influência inglesa e foi prescrito pela lei de 1827 como solução para a escassez de mestres, embora tenha sido defendido por diversos presidentes de província em seus relatórios, [[acabou sendo progressivamente abandonado]].",

  const runs=(load("prog",{})[key]||[]).slice(-2);
  const p=pct(c,t);
  if(runs.length===2&&runs.every(r=>pct(r.c,r.t)>=80))return '<span class="pill up">Pode subir de nível</span> Duas sessões seguidas com 80% ou mais.';
  if(p>=80)return '<span class="pill keep">Manter</span> Bom resultado. Repita mais uma sessão neste nível antes de subir.';
  if(p<50)return '<span class="pill down">Descer um nível</span> Abaixo de 50%. Volte ao nível anterior na próxima sessão; isso faz parte do método.';
  return '<span class="pill keep">Manter</span> Continue neste nível até chegar a 80%.';
}
function optsHTML(list){return '<div class="opts">'+list.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")+"</div>"}
function bindOpts(list,correct,onDone){
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,right=list[i]===correct;
    main.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(list[+x.dataset.i]===correct)x.classList.add("right")});

}

function navBar(n,i,feito,rotulo,fim){let s=`<div class="steps nav" role="navigation" aria-label="Ir para um parágrafo">`;
  for(let k=0;k<n;k++){const d=feito(k),r=rotulo(k);s+=`<button type="button" class="${k===i?"now":d?"done":""}" data-nav="${k}" title="${esc(r)}" aria-label="${esc(r)}${d?", feito":""}"${k===i?' aria-current="step"':""}><i class="${k===i?"now":d?"done":""}"></i></button>`}
  if(fim)s+=`<button type="button" class="fim${i>=n?" now":""}" data-nav="${n}" title="${esc(fim)}" aria-label="${esc(fim)}"${i>=n?' aria-current="step"':""}><i></i></button>`;
  return s+"</div>"}
function stepsBar(n,i){let s='<div class="steps" aria-label="Progresso">';for(let k=0;k<n;k++)s+=`<i class="${k<i?"done":k===i?"now":""}"></i>`;return s+"</div>"}

  if(m==="mediador"){const f=document.getElementById("mfab");if(f)f.hidden=false;if(typeof iniciarMsg==="function")iniciarMsg()}
  else{["mfab","mpainel","mtoast"].forEach(id=>{const e=document.getElementById(id);if(e)e.hidden=true});if(tab==="prof")tab="inicio"}
  renderTabs();if(tab==="inicio")renderInicio();toast(m==="mediador"?"Modo mediador: a aba Mediador está no menu.":"Estudo por conta própria: a LIO mostra só o que você usa para estudar.")}
function blocoModo(){if(!CAP.ready||!podeMediar())return "";const m=modoUso();

  return `<div class="hcard destaque" id="hcModo"><b>Como você vai usar a LIO?</b><span class="note">Dá para mudar quando quiser, no fim desta página.</span>
   <div class="choices"><button class="choice" type="button" data-modo="autonomo"><b>Estudar por conta própria</b><span>Você estuda o seu material com a IA. É o uso mais comum.</span></button>
   <button class="choice" type="button" data-modo="mediador"><b>Mediar um grupo</b><span>Além de estudar, prepara atividades e acompanha outras pessoas. Pode ser professor, tutor ou um colega que organiza o estudo.</span></button></div>

   <div class="row"><button class="btn primary" id="hcGo">Continuar</button>${lst.length>1?'<button class="btn small" id="hcTodos">Ver todos</button>':""}</div>`;
  $("#hcGo").onclick=()=>{tab="estudo";save("tab",tab);renderTabs();estOpen(u.id)};
  const t=$("#hcTodos");if(t)t.onclick=()=>{tab="estudo";save("tab",tab);est.view="lib";go()};
  const r=$("#hcRev");if(r){if(rv.dados){try{const R=resumoRev();r.querySelector(".note").textContent=R.devidos?`${R.devidos} ${R.devidos===1?"cartão":"cartões"} para hoje.`:R.total?"Nada vence hoje. Você está em dia.":"Os cartões aparecem depois que você estuda uma seção."}catch(e){}}else if(!rv.carregando)carregarRev()}}

/* ---------------- Exercício 1 ---------------- */
let e1={txt:0,lvl:1,run:null};
const NIVEIS1=[[1,"Nível 1 · imediato","Pergunta logo após esconder cada parágrafo."],
 [2,"Nível 2 · com atraso","A pergunta sobre um parágrafo só vem depois de ler o seguinte."],
 [3,"Nível 3 · seção inteira","Lê todos os parágrafos e, no fim, ordena as ideias centrais."]];
function renderEx1(){if(e1.run)return ex1Step();
  const cab=`<div class="stack"><span class="eyebrow">Exercício 1 · manutenção com recuperação progressiva</span>
  <h1>Guardar o que foi lido</h1>
  <p class="lead">Leia um parágrafo de cada vez. Ao esconder, a ideia central precisa estar com você. Escrever uma etiqueta de 3 a 5 palavras enquanto lê ajuda a agrupar a informação.</p></div>${fonteBar()}`;
  const gd=guardaPDF()||(DX().textos.length?"":vazio("Esta seção não tem parágrafos com perguntas. Escolha outra seção."));
  if(gd){main.innerHTML=cab+gd;ligarFonte();return}
  if(e1.txt>=DX().textos.length)e1.txt=0;
  main.innerHTML=`${cab}
  <div class="stack"><h2>${usandoPDF()?"Trecho":"Texto"}</h2><div class="choices">${DX().textos.map((t,i)=>`<button class="choice" data-txt="${i}" aria-pressed="${e1.txt===i}"><b>${t.titulo}</b><span>${t.periodo} · ${t.pars.length} parágrafos</span></button>`).join("")}</div></div>
  <div class="stack"><h2>Nível</h2><div class="choices">${NIVEIS1.map(([n,l,d])=>`<button class="choice" data-lvl="${n}" aria-pressed="${e1.lvl===n}"><b>${l}</b><span>${d}</span></button>`).join("")}</div></div>
  <div class="row"><button class="btn primary" id="start">Começar</button></div>`;
  ligarFonte();
  main.querySelectorAll("[data-txt]").forEach(b=>b.onclick=()=>{e1.txt=+b.dataset.txt;renderEx1()});
  main.querySelectorAll("[data-lvl]").forEach(b=>b.onclick=()=>{e1.lvl=+b.dataset.lvl;renderEx1()});
  $("#start").onclick=()=>{
    const n=DX().textos[e1.txt].pars.length,s=[];
    if(e1.lvl===1)for(let k=0;k<n;k++)s.push(["read",k],["ask",k]);
    else if(e1.lvl===2){s.push(["read",0]);for(let k=1;k<n;k++)s.push(["read",k],["ask",k-1]);s.push(["ask",n-1])}
    else{for(let k=0;k<n;k++)s.push(["read",k]);s.push(["order"])}
    e1.run={steps:s,i:0,c:0,t:0,tags:{},order:null};ex1Step();
  };
}
function ex1Step(){
  const r=e1.run,T=DX().textos[e1.txt];
  if(r.i>=r.steps.length)return ex1End();
  const [type,k]=r.steps[r.i],head=`<div class="stack"><span class="eyebrow">${T.titulo} · nível ${e1.lvl}</span>${stepsBar(r.steps.length,r.i)}</div>`;
  if(type==="read"){
    main.innerHTML=`${head}<div class="passage"><span class="label">Parágrafo ${k+1} de ${T.pars.length}</span><p>${T.pars[k].t}</p></div>
    <div class="field"><label for="tag">Sua etiqueta para este parágrafo (3 a 5 palavras, opcional)</label><input id="tag" autocomplete="off" value="${r.tags[k]||""}"></div>
    <div class="row"><button class="btn primary" id="nx">Guardar e esconder</button><button class="btn" id="quit">Sair</button></div>`;
    $("#nx").onclick=()=>{r.tags[k]=$("#tag").value.trim();r.i++;ex1Step()};
  }else if(type==="ask"){
    const P=T.pars[k],list=shuffle([P.ok,...P.no]);
    const delay=e1.lvl===2&&k<T.pars.length-1?" (o anterior, não o que acabou de ler)":"";
    main.innerHTML=`${head}<div class="hiddenbox">O texto está escondido.</div>
    <p class="q">Sem olhar: qual é a ideia central do parágrafo ${k+1}${delay}?</p>${optsHTML(list)}<div id="fb" aria-live="polite"></div>`;
    bindOpts(list,P.ok,right=>{r.t++;if(right)r.c++;
      $("#fb").innerHTML=`<div class="stack"><div class="fb"><b class="${right?"ok":"bad"}">${right?"Isso.":"Não era essa."}</b> ${r.tags[k]?`Sua etiqueta: <i>${r.tags[k]}</i>.`:""}</div><div class="row"><button class="btn primary" id="nx">Continuar</button><button class="btn" id="see">Rever o parágrafo</button></div><div id="rev"></div></div>`;
      $("#nx").onclick=()=>{r.i++;ex1Step()};
      $("#see").onclick=()=>{$("#rev").innerHTML=`<div class="passage"><p>${P.t}</p></div>`};
    });
  }else{
    if(!r.order)r.order=shuffle(T.pars.map((p,i)=>i));
    main.innerHTML=`${head}<div class="hiddenbox">Os ${T.pars.length} parágrafos estão escondidos.</div>
    <p class="q">Coloque as ideias centrais na ordem em que apareceram no texto.</p>
    <ol class="orderlist" id="ol"></ol><div class="row"><button class="btn primary" id="chk">Conferir ordem</button></div><div id="fb" aria-live="polite"></div>`;
    orderList($("#ol"),r.order,i=>T.pars[i].ok);
    $("#chk").onclick=()=>{
      let ok=0;r.order.forEach((v,pos)=>{if(v===pos)ok++});r.c+=ok;r.t+=r.order.length;
      orderList($("#ol"),r.order,i=>T.pars[i].ok,true);$("#chk").remove();
      $("#fb").innerHTML=`<div class="stack"><div class="fb"><b class="${ok===r.order.length?"ok":"bad"}">${ok} de ${r.order.length} na posição certa.</b> Os números mostram a posição correta de cada ideia.</div><div class="row"><button class="btn primary" id="nx">Ver resultado</button></div></div>`;
      $("#nx").onclick=()=>{r.i++;ex1Step()};
    };
  }
  const q=$("#quit");if(q)q.onclick=()=>{e1.run=null;renderEx1()};
}
function orderList(ol,arr,label,check){
  ol.innerHTML=arr.map((v,pos)=>`<li class="${check?(v===pos?"right":"wrong"):""}"><span class="pos">${check?v+1:pos+1}</span><span class="txt">${label(v)}</span>${check?"":`<span class="mv"><button class="btn small" data-up="${pos}" aria-label="Subir" ${pos===0?"disabled":""}>↑</button><button class="btn small" data-dn="${pos}" aria-label="Descer" ${pos===arr.length-1?"disabled":""}>↓</button></span>`}</li>`).join("");
  if(check)return;
  ol.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const p=+b.dataset.up;[arr[p-1],arr[p]]=[arr[p],arr[p-1]];orderList(ol,arr,label)});
  ol.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{const p=+b.dataset.dn;[arr[p+1],arr[p]]=[arr[p],arr[p+1]];orderList(ol,arr,label)});
}
function ex1End(){const r=e1.run,key=pk("ex1:"+e1.lvl);record(key,r.c,r.t);
  main.innerHTML=endHTML(DX().textos[e1.txt].titulo+" · nível "+e1.lvl,r.c,r.t,key);
  $("#again").onclick=()=>{e1.run=null;$("#start")||renderEx1();$("#start").click()};
  $("#back").onclick=()=>{e1.run=null;renderEx1()};
}
function endHTML(title,c,t,key){
  return `<div class="stack"><span class="eyebrow">Rodada concluída · ${title}</span><div class="score">${c}/${t} <span class="note">${pct(c,t)}%</span></div>
  <p>${advice(key,c,t)}</p></div><div class="row"><button class="btn primary" id="again">Repetir</button><button class="btn" id="back">Escolher outro</button></div>`;
}

let e2={sub:"lab",run:null,vozMem:true};
const SUB2=[["lab","Frases-labirinto"],["voz","Vozes do texto"],["nota","Notas de rodapé"]];
function subNav(list,cur){return '<div class="subtabs">'+list.map(([id,l])=>`<button class="chip" data-sub="${id}" aria-pressed="${cur===id}">${l}</button>`).join("")+"</div>"}

  const intro={lab:"Frases longas obrigam a segurar o sujeito enquanto se atravessam várias orações. Encontre o núcleo: quem faz o quê. Tudo o que está entre vírgulas, ou começa com que, cujo, embora, ao, segundo, é desvio.",

function ex2Lab(){const r=e2.run,ex=$("#ex");
  if(r.i>=DX().lab.length)return ex2End("lab","Frases-labirinto");
  const L=DX().lab[r.i],list=shuffle([L.ok,...L.no]);
  ex.innerHTML=`${stepsBar(DX().lab.length,r.i)}<div class="passage"><span class="label">Frase ${r.i+1} de ${DX().lab.length}</span><p id="fr">${plain(L.f)}</p></div>
  <p class="q">Qual é o núcleo desta frase?</p>${optsHTML(list)}<div id="fb" aria-live="polite"></div>`;
  bindOpts(list,L.ok,right=>{r.t++;if(right)r.c++;$("#fr").innerHTML=marked(L.f);
    $("#fb").innerHTML=`<div class="stack"><div class="fb"><b class="${right?"ok":"bad"}">${right?"Isso.":"Não é o núcleo."}</b> O núcleo está marcado na frase. As outras opções são informações verdadeiras do trecho, mas ficam nos desvios.</div><div class="row"><button class="btn primary" id="nx">Próxima frase</button></div></div>`;
    $("#nx").onclick=()=>{r.i++;ex2Lab()};});
}
function ex2Voz(){const r=e2.run,ex=$("#ex");
  if(r.i>=DX().vozes.length)return ex2End("voz","Vozes do texto");
  const V=DX().vozes[r.i],keys=Object.keys(V.vozes);
  const trecho=(color)=>`<div class="passage"><span class="label">${V.titulo}</span><p>${V.segs.map(([v,t])=>color&&!V.semCor?`<span class="seg v-${v}">${t}</span>`:t).join("")}</p></div>`;
  const legend=`<div class="legend">${keys.map(k=>`<span class="v-${k}">${V.vozes[k]}</span>`).join("")}</div>`;
  const modeRow=`<div class="row"><span class="note">Modo:</span><button class="chip" id="m1" aria-pressed="${!e2.vozMem}">Texto visível</button><button class="chip" id="m2" aria-pressed="${e2.vozMem}">De memória</button></div>`;
  if(r.ph===0&&e2.vozMem){
    ex.innerHTML=`${stepsBar(DX().vozes.length,r.i)}${modeRow}${trecho(false)}<div class="row"><button class="btn primary" id="hide">Esconder e responder</button></div>`;
    $("#hide").onclick=()=>{r.ph=1;ex2Voz()};
  }else{

const REL=["concorda","discorda","concorda em parte","usa como fonte","usa como exemplo"];
function dadosPDF(S){const g=S.gen,E=esc,fl=k=>sinal(S,k),num=i=>corpo(S).indexOf(i)+1;
  const ide=g.ideias.filter(x=>!fl("i"+x.i)&&S.pars[x.i]).sort((a,b)=>a.i-b.i);
  const ps=ide.map(x=>({t:E(S.pars[x.i].t),ok:E(x.ok),no:x.no.map(E),i:x.i}));
  const bl=[];for(let k=0;k<ps.length;k+=5)bl.push(ps.slice(k,k+5));
  if(bl.length>1&&bl[bl.length-1].length<2)bl[bl.length-2].push(...bl.pop());
  const textos=bl.map(b=>({titulo:`Parágrafos ${num(b[0].i)}–${num(b[b.length-1].i)}`,periodo:(()=>{const x=S.pars[b[0].i].pg,y=S.pars[b[b.length-1].i].pg;return x===y?`p. ${x}`:`p. ${x}–${y}`})(),pars:b}));
  const lab=g.lab.map((x,k)=>({x,k})).filter(o=>!fl("l"+o.k)).map(({x})=>{const set=new Set(x.ok.split(/\s+/).map(norm).filter(w=>w.length>=3));
    return {f:x.frase.split(/(\s+)/).map(w=>set.has(norm(w))?`[[${E(w)}]]`:E(w)).join(""),ok:E(x.ok),no:x.no.map(E)}});
  let vozes=[];
  if(g.vozes){const outros=g.vozes.lista.filter(v=>v.id!=="autor").slice(0,3),cls={autor:"autor"};outros.forEach((v,i)=>cls[v.id]="bcd"[i]);
    const nomes={autor:"O autor do texto"};outros.forEach(v=>nomes[cls[v.id]]=E(v.nome));
    const cl=g.vozes.af.map((x,k)=>({x,k})).filter(o=>!fl("v"+o.k)&&cls[o.x.v]).map(({x})=>[E(x.t),cls[x.v]]);
    if(cl.length>=2&&new Set(cl.map(c=>c[1])).size>=2)vozes=[{titulo:E(S.titulo),vozes:nomes,semCor:true,
      segs:S.pars.filter(p=>!p.h).map((p,i)=>["autor",(i?"<br><br>":"")+E(p.t)]),claims:cl}]}
  const usados=new Set(),notas=[];
  for(const n of S.notas){if(notas.length>=4)break;const x=ide.find(y=>S.pars[y.i].pg===n.pg&&!usados.has(y.i));if(!x)continue;usados.add(x.i);
    notas.push({p:E(S.pars[x.i].t),n:E(n.t),q:"Qual é a ideia central do parágrafo que você leu antes da nota?",ok:E(x.ok),no:x.no.map(E)})}
  const a=g.arg?g.arg.filter((x,k)=>!fl("a"+k)):[];
  const arg=a.length>=3?[{titulo:E(S.titulo),itens:a.map(x=>[E(x.t),x.r])}]:[];
  let crono=[];
  if(arr(g.crono).length>=3){const ev=g.crono.slice().sort((x,y)=>(parseInt(x.a)||0)-(parseInt(y.a)||0));
    const idx=[...new Set(ev.map(x=>x.p).filter(p=>p!=null))].sort((x,y)=>x-y);
    const texto=(idx.length?idx:corpo(S)).map(i=>E(S.pars[i].t)).join("<br><br>");
    crono=[{titulo:E(S.titulo),texto,ev:ev.map(x=>[E(x.a),E(x.e)])}]}
  const comp=[];
  if(g.vozes){const nome=Object.fromEntries(g.vozes.lista.map(v=>[v.id,v.nome]));const rs=g.vozes.rel.filter(r=>REL.includes(r.r));
    for(let k=0;k+1<rs.length&&comp.length<3;k+=2){const A=rs[k],B=rs[k+1],outras=shuffle(REL.filter(r=>r!==A.r));
      comp.push({titulo:`${E(nome[A.v])} e ${E(nome[B.v])}`,a:`<b>${E(nome[A.v])}</b>: ${E(A.t)}`,b:`<b>${E(nome[B.v])}</b>: ${E(B.t)}`,
        q:`Como o autor do texto se relaciona com ${E(nome[A.v])}?`,ok:E(A.r[0].toUpperCase()+A.r.slice(1)),
        no:(outras.includes(B.r)&&B.r!==A.r?[B.r,...outras.filter(r=>r!==B.r)]:outras).slice(0,2).map(r=>E(r[0].toUpperCase()+r.slice(1)))})}}
  return {textos,lab,vozes,notas,arg,crono,comp};
}

     ${c.texto?`<details><summary>Rever o trecho original (p. ${c.pg})</summary><p class="note-t">${esc(c.texto)}</p></details>`:""}

  if(S.fase==="frente"){const r=$("#rvr");r.oninput=()=>{S.rasc=r.value};$("#rvm").onclick=()=>{S.fase="verso";renderRev()};S.tc=S.tc||Date.now()}

function avaliar(nota){const S=rv.ses,{c,E,novo}=S.fila[S.i],st=proximo(E.est[c.id],nota);

  logEv("revisao",{est:c.est,sec:c.sec,tipo:c.tipo,nota,int:st.i,ms:Date.now()-(S.tc||Date.now())});
  S.feitos++;if(nota>0)S.acertos++;
  if(nota===0&&!S.repetidos.has(c.id)){S.repetidos.add(c.id);S.fila.push({c,E,novo:false})}

const MAMMOTH="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
let mamLib=null;
function loadMammoth(){if(mamLib)return mamLib;mamLib=new Promise((res,rej)=>{const s=document.createElement("script");s.src=MAMMOTH;s.onload=()=>res(window.mammoth);s.onerror=()=>{mamLib=null;rej(new Error("mammoth"))};document.head.appendChild(s)});return mamLib}
function parsDeTexto(txt){const blocos=txt.replace(/\r/g,"").split(/\n\s*\n|\n(?=\s{2,}|\t)/).map(b=>b.replace(/-\n(?=[a-zà-ÿ])/g,"").replace(/\s*\n\s*/g," ").trim()).filter(b=>b.length>1);
  let pg=1,acc=0;const pars=[];
  for(const b of blocos){const head=b.length<90&&!TERM.test(b)&&!/,$/.test(b)&&/^[A-ZÀ-Ý0-9]/.test(b)&&!/^\d+[.)]\s/.test(b);
    pars.push(head?{t:b,pg,h:true}:{t:b,pg});acc+=b.length;if(acc>=2800){pg++;acc=0}}
  const out=[];for(const p of pars){if(p.h||p.fig){out.push(p);continue}for(const t of partirLongoTex(p.t))out.push({...p,t})}
  return out}
function usarTexto(txt,titulo,nome){const pars=parsDeTexto(txt);if(!pars.some(p=>!p.h)){toast("Não encontrei texto para estudar.");return false}
  const maxPg=Math.max(...pars.map(p=>p.pg));
  est.nv={pdf:null,texto:true,nome:nome||"Texto colado",titulo:titulo||nome||"Texto colado",n:maxPg,de:1,ate:maxPg,ext:{scanned:[],pages:{},from:1,to:maxPg},pars,notas:[]};
  est.nv.secs=seccionar(pars,[]);estNovo();return true}
async function abrirDocx(f){$("#st").innerHTML='<span class="spin"></span>Abrindo o arquivo do Word…';
  try{const m=await loadMammoth(),r=await m.extractRawText({arrayBuffer:await f.arrayBuffer()});
    if(!usarTexto(r.value||"",f.name.replace(/\.docx$/i,"").replace(/[_-]+/g," ").trim(),f.name))$("#st").textContent="O arquivo não tem texto."}
  catch(e){if($("#st"))$("#st").textContent=e&&e.message==="mammoth"?"Não foi possível carregar o leitor de arquivos do Word. Verifique a conexão.":"Não foi possível abrir este arquivo do Word."}}

/* ======================= COMPREENSÃO (literal, inferencial, crítica) ======================= */
const NIVEL={literal:"Literal",inferencial:"Inferencial",critica:"Aplicação"};
const NIVEL_DESC={literal:"A resposta está escrita no texto.",inferencial:"Exige ligar informações ou deduzir o que o texto dá a entender.",critica:"Pede que você use o conceito numa situação nova ou explique um fenômeno com base no texto."};
const CONF=[[1,"Pouco seguro"],[2,"Mais ou menos"],[3,"Seguro"]];
const trechoNum=S=>S.pars.map((p,i)=>p.del?null:p.h?`## ${p.t}`:`[P${i+1}] ${p.t}`).filter(x=>x!==null).join("\n\n");
function promptPerg(S){return `Você prepara perguntas de compreensão para um estudante que estuda ${PERFIS[perfilAtual()]} por um livro didático. Use SOMENTE o trecho abaixo. Escreva em português do Brasil, com frases curtas e claras.

Crie 6 perguntas abertas: 2 literais (a resposta está escrita no texto), 2 inferenciais (exigem ligar informações de parágrafos diferentes ou deduzir o que o texto dá a entender sem dizer) e 2 de aplicação (pedem que o estudante use um conceito do trecho numa situação nova e concreta, ou explique um fenômeno do cotidiano com base no trecho; não peça cálculos longos). Toda fórmula e símbolo em LaTeX entre \\( e \\); nunca use $.

Responda apenas com JSON neste formato:
{"perguntas":[{"nivel":"literal","pergunta":"...","p":2,"resposta":"..."}]}

- "nivel" é "literal", "inferencial" ou "critica" (use "critica" para as de aplicação).
- "p" é o número do parágrafo [Pn] que mais ajuda a responder.
- "resposta": para literal e inferencial, a resposta esperada em até 40 palavras; para aplicação, o que uma boa resposta precisa conter, em até 40 palavras.

TRECHO:
${trechoNum(S)}`}
function validarPerg(g,S){const nP=S.pars.length;
  return arr(g&&g.perguntas).filter(x=>x&&NIVEL[x.nivel]&&str(x.pergunta)&&str(x.resposta)).map(x=>({n:x.nivel,q:x.pergunta.trim(),r:x.resposta.trim(),p:Number.isInteger(+x.p)&&+x.p>=1&&+x.p<=nP&&!S.pars[+x.p-1].h?+x.p-1:null})).slice(0,9)}
function promptFeedback(S,Q,resp){return `Você é um tutor paciente que ajuda um estudante com dificuldade de compreensão de leitura. Avalie a resposta do estudante com base SOMENTE no trecho. Seja específico e gentil. Não dê nota numérica, não faça elogios vazios e não entregue a resposta pronta na dica.

Responda apenas com JSON:
{"avaliacao":"completa","acertou":"...","faltou":"...","dica":"...","p":3}

- "avaliacao": "completa", "parcial" ou "incompleta". Numa pergunta de aplicação, é "completa" quando o estudante usa corretamente o conceito do trecho na situação, mesmo com palavras diferentes da referência. Aceite notação matemática informal (como v^2 ou x2 para x ao quadrado).
- "acertou": o que a resposta tem de correto, em uma frase (vazio se nada).
- "faltou": o que faltou ou está impreciso, em uma ou duas frases (vazio se nada).
- "dica": onde olhar no texto ou como pensar, em uma frase.
- "p": número do parágrafo [Pn] que mais ajuda.

PERGUNTA (${NIVEL[Q.n].toLowerCase()}): ${Q.q}
REFERÊNCIA PARA O AVALIADOR: ${Q.r}
RESPOSTA DO ESTUDANTE: ${resp}

TRECHO:
${trechoNum(S)}`}
const AV={completa:["ok","Completa"],parcial:["prog","Parcial"],incompleta:["bad","Ainda incompleta"]};
async function gerarPerg(S){const ctl=new AbortController();est.pjob={ctl,S};pComp(S,$("#st"));
  try{const g=await CAP.sample.json(promptPerg(S),{signal:ctl.signal,cache:false});const v=validarPerg(g,S);
    if(v.length<3)throw {code:"poucas"};delete S._perr;await salvarSec(S,{perg:v});est.ci=0;toast("Perguntas prontas.")}
  catch(e){avisoIA(e);if(!(e&&e.code==="cancelled"&&ctl.signal.aborted)){S._perr=e&&e.code==="poucas"?"O Claude não conseguiu montar perguntas suficientes para esta seção.":sampleMsg(e);toast(S._perr)}}
  est.pjob=null;if(est.view==="secao"&&est.step==="compreensao"&&est.secoes[est.si]===S)pComp(S,$("#st"))}
function pComp(S,el){if(!el)return;const R=S.resp;R.perg=R.perg||{};

      <p class="note">As respostas entram no fichamento, e as literais e inferenciais viram cartões de revisão.</p>

    $("#nx").onclick=()=>proximoPasso(S);$("#re").onclick=()=>{est.ci=0;pComp(S,el)};return}
  const Q=lista[est.ci],A=R.perg[Q.k],st=est.cst&&est.cst.k===Q.k?est.cst:(est.cst={k:Q.k,conf:A?A.conf:0,fb:A&&A.fb?A.fb:null,auto:!!(A&&A.auto),au:A&&A.auto?A.av:null,txt:A?A.r:(load("rasc_"+est.id+"_"+S.n+"_"+Q.k,"")||""),tent:A?A.tent||1:0});
  el.innerHTML=`${stepsBar(lista.length,est.ci)}<div class="stack"><span class="eyebrow">${NIVEL[Q.n]} · ${esc(NIVEL_DESC[Q.n])}</span>
   <div class="passage cartao"><p><b>${esc(Q.q)}</b></p></div>
   ${Q.p!=null?`<details><summary>Rever o trecho que ajuda (p. ${S.pars[Q.p].pg})</summary><p class="note-t">${esc(S.pars[Q.p].t)}</p></details>`:""}
   <div class="field"><label for="pr">Sua resposta, com as suas palavras</label><textarea id="pr" style="min-height:7rem">${esc(st.txt||"")}</textarea></div>
   <div class="stack"><span class="pnl-lbl">Quão seguro você está desta resposta?</span><div class="subtabs">${CONF.map(([v,t])=>`<button class="chip" data-cf="${v}" aria-pressed="${st.conf===v}">${t}</button>`).join("")}</div></div>
   <div class="row"><button class="btn primary" id="penv" ${st.txt&&st.txt.trim().split(/\s+/).length>=3&&st.conf?"":"disabled"}>${CAP.sample?"Enviar para retorno":"Comparar com a referência"}</button><button class="btn small" id="ppul">Pular</button></div>
   <div id="pfb" aria-live="polite">${st.fb?fbHTML(S,Q,st.fb):st.auto?autoHTML(Q,st):""}</div></div>`;
  const ta=$("#pr"),pode=()=>{const b=$("#penv");if(b)b.disabled=!(ta.value.trim().split(/\s+/).length>=3&&st.conf)};

      logEv("pergunta",{est:est.id,sec:S.n,nivel:Q.n,conf:st.conf,av:st.au,tent:st.tent||1,tipo:"autoavaliacao"});$("#pfb").innerHTML=autoHTML(Q,st);ligarAuto()});

const ESPERA_EXPL=15;
function promptExpl(S,P){return `Um estudante travou na leitura do parágrafo abaixo. Explique sem acrescentar ideias que não estão nele. Responda apenas com JSON:
{"simples":"...","exemplo":"...","termos":[{"termo":"...","sentido":"..."}]}

- "simples": o mesmo conteúdo em linguagem mais simples, com frases curtas, no máximo do tamanho do original.
- "exemplo": um exemplo concreto ou comparação curta que ajude a entender (vazio se não couber).
- "termos": até 3 palavras ou expressões difíceis do parágrafo, com o sentido que têm neste texto, em até 20 palavras cada.

SEÇÃO: ${S.titulo}
PARÁGRAFO:
${P.t}`}
function explHTML(x){return `<div class="panel apoio"><b>Apoio de leitura</b><p class="note">Use como ponte e volte ao original: a etiqueta deve resumir o texto do autor.</p>
  ${x.simples?`<p>${esc(x.simples)}</p>`:""}${x.exemplo?`<p><b>Exemplo:</b> ${esc(x.exemplo)}</p>`:""}
  ${x.termos.length?`<ul class="gloss">${x.termos.map((t,k)=>`<li><span class="gt"><b>${esc(t.termo)}</b>: ${esc(t.sentido)}</span><button class="btn small" data-gt="${k}">Pôr no glossário</button></li>`).join("")}</ul>`:""}</div>`}
function ligarExpl(S,i){const box=$("#explBox"),b=$("#expl");if(!b||!box)return;const R=S.resp;est.explCache=est.explCache||{};const key=est.id+":"+S.n+":"+i;
  const mostra=x=>{box.innerHTML=explHTML(x);box.querySelectorAll("[data-gt]").forEach(g=>g.onclick=()=>{const t=x.termos[+g.dataset.gt];R.gloss=arr(R.gloss);
    if(!R.gloss.some(z=>norm(z.termo)===norm(t.termo)))R.gloss.push({termo:t.termo,sentido:t.sentido,p:i});salvarResp(S);g.disabled=true;g.textContent="No glossário"})};
  if(est.explCache[key]){mostra(est.explCache[key]);b.hidden=true;return}
  let s=ESPERA_EXPL;b.disabled=true;
  tick=setInterval(()=>{s--;const x=$("#expl");if(!x){stopTick();return}if(s<=0){stopTick();x.disabled=false;x.textContent="Explique de outro jeito"}else x.textContent=`Explique de outro jeito (em ${s} s)`},1000);
  b.onclick=async()=>{b.disabled=true;box.innerHTML='<p class="note"><span class="spin"></span>Preparando uma explicação…</p>';
    try{const P=S.pars[i],r=await CAP.sample.json(promptExpl(S,P),{modelTier:"quick"});
      const pt=norm(P.t),x={simples:str(r&&r.simples)?r.simples.trim():"",exemplo:str(r&&r.exemplo)?r.exemplo.trim():"",termos:arr(r&&r.termos).filter(t=>t&&str(t.termo)&&str(t.sentido)&&pt.includes(norm(t.termo))).slice(0,3)};
      est.explCache[key]=x;R.dif=R.dif||{};R.dif[i]=true;salvarResp(S);logEv("explicar",{est:est.id,sec:S.n,i});mostra(x);b.hidden=true}
    catch(e){box.innerHTML=`<p class="note" style="color:var(--bad)">${esc(sampleMsg(e))}</p>`;b.disabled=false}}}

/* ======================= PRÉ-TESTE E PÓS-TESTE ======================= */
const FASES={pre:"Pré-teste",pos:"Pós-teste",tardio:"Pós-teste tardio"};
const DIAS_TARDIO=7;
function promptTeste(n,secoes){secoes=secoes||est.secoes;const cap=150000;let t="",k=0;
  for(const S of secoes){const bloco=`[S${S.n+1}] ${S.titulo}\n`+S.pars.map((p,i)=>p.h?`## ${p.t}`:`[S${S.n+1}-P${i+1}] ${p.t}`).join("\n\n").slice(0,9000)+"\n\n";if(t.length+bloco.length>cap)break;t+=bloco;k++}
  return {k,txt:`Crie um teste de compreensão de leitura sobre o texto abaixo, dividido em seções [Sn]. Use SOMENTE o texto. Faça ${n} questões de múltipla escolha, cerca de metade literais (resposta escrita no texto) e metade inferenciais (exigem ligar informações ou deduzir), distribuídas entre as seções. As alternativas devem ter tamanho e tom parecidos, ser plausíveis para quem leu mal e não usar "todas as anteriores" nem "nenhuma das anteriores".

Responda apenas com JSON:
{"itens":[{"secao":1,"p":3,"nivel":"literal","pergunta":"...","certa":"...","erradas":["...","...","..."]}]}

- "secao" é o número n de [Sn]; "p" é o número do parágrafo [Sn-Pm] (m) de onde vem a resposta.

TEXTO:
${t}`}}
function validarTeste(g,secoes){const sec=new Map((secoes||est.secoes).map(S=>[S.n+1,S])),vistos=new Set();
  return arr(g&&g.itens).filter(x=>{if(!x||!sec.has(+x.secao)||!str(x.pergunta)||!str(x.certa)||arr(x.erradas).filter(str).length<3)return false;const k=norm(x.pergunta);if(vistos.has(k))return false;vistos.add(k);return true})
    .map(x=>{const S=sec.get(+x.secao),pi=Number.isInteger(+x.p)&&+x.p>=1&&+x.p<=S.pars.length?+x.p-1:null;
      return {q:x.pergunta.trim(),ok:x.certa.trim(),no:x.erradas.filter(str).slice(0,3).map(s=>s.trim()),sec:S.n,pg:pi!=null?S.pars[pi].pg:S.pgIni,n:x.nivel==="inferencial"?"inferencial":"literal"}}).slice(0,12)}
function diasDesde(iso){return Math.floor((Date.now()-new Date(iso).getTime())/86400000)}
function blocoTeste(){const m=est.meta,T=m.teste,Rz=m.resultados||{};
  const iniciou=est.secoes.some(S=>S.status!=="nova");
  const linha=f=>{const r=Rz[f];return `<tr><td>${FASES[f]}</td><td class="num">${r?`${r.c}/${r.t} (${pct(r.c,r.t)}%)`:"—"}</td><td>${r?new Date(r.d).toLocaleDateString("pt-BR"):""}</td></tr>`};
  let acao="";
  const emCurso=load("tst_"+est.id,null),cont=f=>emCurso&&emCurso.fase===f?`Continuar (questão ${emCurso.i+1})`:null;
  if(!T)acao=m.origem?`<span class="note">O mediador não incluiu um teste nesta atividade.</span>`:CAP.sample?`<button class="btn" id="tgen">Preparar o teste</button>`:`<span class="note">${esc(semGen())}</span>`;
  else if(!Rz.pre&&!Rz.pos)acao=`<button class="btn primary" data-tf="pre">${cont("pre")||"Fazer o pré-teste"}</button>${iniciou?'<span class="note">Você já começou a estudar, então o pré-teste vale menos como ponto de partida.</span>':""}<button class="btn small" data-tf="pos">Pular para o pós-teste</button>`;
  else if(!Rz.pos)acao=`<button class="btn primary" data-tf="pos">${cont("pos")||"Fazer o pós-teste"}</button><span class="note">Faça depois de estudar as seções.</span>`;
  else if(!Rz.tardio){const d=diasDesde(Rz.pos.d);acao=d>=DIAS_TARDIO?`<button class="btn primary" data-tf="tardio">${cont("tardio")||"Fazer o pós-teste tardio"}</button>`:`<span class="note">O pós-teste tardio fica disponível em ${DIAS_TARDIO-d} dia${DIAS_TARDIO-d>1?"s":""}. Ele mede o que ficou na memória.</span>`}
  else acao=`<button class="btn" id="trev">Ver as questões e as respostas</button>`;
  return `<div class="stack" id="tbloco"><h2>Avaliação: antes e depois</h2>
  <p class="note">Um mesmo teste de ${T?T.itens.length:"8 a 12"} questões feito antes de estudar, logo depois e de novo após ${DIAS_TARDIO} dias. As respostas certas só aparecem depois do último, para não influenciar os seguintes.</p>
  ${T?`<div class="tbl"><table><thead><tr><th>Etapa</th><th>Acertos</th><th>Data</th></tr></thead><tbody>${["pre","pos","tardio"].map(linha).join("")}</tbody></table></div>`:""}
  <div class="row" id="tacao">${acao}</div>${est.tjob?'<p class="note"><span class="spin"></span>Preparando o teste a partir de todas as seções… pode levar até 2 minutos.</p>':""}${m._terr?`<p class="note" style="color:var(--bad)">${esc(m._terr)}</p>`:""}</div>`}
function ligarTeste(){const g=$("#tgen");if(g)g.onclick=prepararTeste;
  main.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>iniciarTeste(b.dataset.tf));
  const r=$("#trev");if(r)r.onclick=()=>{est.tst={fase:"rev"};estGo("teste")}}
async function prepararTeste(){if(est.tjob)return;const ctl=new AbortController();est.tjob=ctl;delete est.meta._terr;estEstudo();
  const n=Math.max(6,Math.min(12,est.secoes.length*2)),{k,txt}=promptTeste(n);
  try{const g=await CAP.sample.json(txt,{signal:ctl.signal,cache:false,maxTokens:12000});const it=validarTeste(g);
    if(it.length<5)throw {code:"poucas"};est.meta.teste={itens:it,criado:agora(),secoes:k};await qw("meta",()=>mRef(est.id).update({teste:est.meta.teste}));toast("Teste pronto.")}
  catch(e){avisoIA(e);if(!(e&&e.code==="cancelled"&&ctl.signal.aborted))est.meta._terr=e&&e.code==="poucas"?"Não saíram questões suficientes. Tente de novo.":sampleMsg(e)}
  est.tjob=null;if(est.view==="estudo")estEstudo()}
const tstKey=()=>"tst_"+est.id;
function iniciarTeste(f){const T=est.meta.teste,sv=load(tstKey(),null);
  est.tst=sv&&sv.fase===f&&sv.n===T.itens.length&&sv.i<T.itens.length?Object.assign(sv,{t0:Date.now()-(sv.ms||0)}):{fase:f,i:0,resp:[],ops:T.itens.map(x=>shuffle([x.ok,...x.no])),t0:Date.now()};estGo("teste")}
function estTeste(){const T=est.meta.teste,st=est.tst,head=`<div class="stack"><button class="linkbtn" id="bk">← ${esc(est.meta.titulo)}</button><span class="eyebrow">${FASES[st.fase]||"Revisão do teste"}</span>`;
  if(st.fase==="rev"){const Rz=est.meta.resultados||{};
    main.innerHTML=`${head}<h1>Questões e respostas</h1></div>${T.itens.map((x,k)=>`<div class="claim"><span class="note">${k+1} · ${x.n==="inferencial"?"Inferencial":"Literal"} · p. ${x.pg}</span><b>${esc(x.q)}</b><span class="t">Resposta: ${esc(x.ok)}</span>
      <span class="note">${["pre","pos","tardio"].filter(f=>Rz[f]).map(f=>`${FASES[f]}: ${Rz[f].resp&&Rz[f].resp[k]===x.ok?"acertou":"errou"}`).join(" · ")}</span></div>`).join("")}`;
    $("#bk").onclick=()=>estGo("estudo");return}
  if(st.i>=T.itens.length){
    main.innerHTML=`${head}<h1>${FASES[st.fase]} concluído</h1></div><div class="score">${st.c}/${T.itens.length} <span class="note">${pct(st.c,T.itens.length)}%</span></div>
    <p>${st.fase==="pre"?"Esse é o ponto de partida. Agora estude as seções e depois faça o pós-teste.":st.fase==="pos"?`Volte daqui a ${DIAS_TARDIO} dias para o pós-teste tardio, que mostra o que ficou na memória.`:"As três etapas estão completas. Você já pode ver as questões e as respostas."}</p>
    <div class="row"><button class="btn primary" id="tok">Voltar ao estudo</button></div>`;
    $("#tok").onclick=()=>estGo("estudo");$("#bk").onclick=()=>estGo("estudo");return}
  const x=T.itens[st.i],ops=st.ops[st.i];
  main.innerHTML=`${head}<h1>Questão ${st.i+1} de ${T.itens.length}</h1>${stepsBar(T.itens.length,st.i)}</div>
  <p class="note">Sem consulta ao texto. Se não souber, marque “Não sei”: chutar atrapalha a medida.</p>
  <div class="passage cartao"><p><b>${esc(x.q)}</b></p></div>${optsHTML([...ops.map(esc),"Não sei"])}`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{const k=+b.dataset.i,esc_=k<ops.length?ops[k]:"";st.resp[st.i]=esc_;st.i++;
    if(st.i<T.itens.length)save(tstKey(),{fase:st.fase,i:st.i,resp:st.resp,ops:st.ops,n:T.itens.length,ms:Date.now()-st.t0});else{try{localStorage.removeItem("lis_"+tstKey())}catch(e){}}
    if(st.i>=T.itens.length){st.c=T.itens.filter((it,j)=>st.resp[j]===it.ok).length;const r={d:agora(),c:st.c,t:T.itens.length,ms:Date.now()-st.t0,resp:st.resp};
      est.meta.resultados=Object.assign({},est.meta.resultados,{[st.fase]:r});qw("meta",()=>mRef(est.id).update({resultados:est.meta.resultados}));agendarEntrega();
      logEv("teste",{est:est.id,fase:st.fase,c:st.c,tt:T.itens.length,ms:r.ms})}
    estTeste();window.scrollTo(0,0)});
  $("#bk").onclick=()=>estGo("estudo");
}

(()=>{const st=document.createElement("style");st.textContent=MAPCSS;document.head.appendChild(st)})();
const RELC={"concorda":"r-ok","discorda":"r-bad","concorda em parte":"r-parte","usa como fonte":"r-fonte","usa como exemplo":"r-ex"};
function mapaArg(S,itens,titulo){const g=r=>itens.filter(x=>x.r===r);
  const box=x=>`<div class="mn m-${x.r}"><span class="mn-r">${PAPEIS[x.r]}</span><p>${esc(x.t)}</p>${S&&x.p!=null&&S.pars[x.p]?`<span class="pgref">p. ${S.pars[x.p].pg}</span>`:""}</div>`;
  const nivel=(r,rot)=>g(r).length?`<div class="mlink" aria-hidden="true"><span>${rot}</span></div><div class="mrow">${g(r).map(box).join("")}</div>`:"";
  return `<figure class="mapa" role="group" aria-label="Mapa do argumento"><figcaption>${titulo||"Mapa do argumento"}</figcaption>
    <div class="mrow">${g("tese").map(box).join("")}</div>${nivel("premissa","▲ sustentada por")}${nivel("evidencia","▲ apoiada em")}${nivel("conclusao","▼ leva a")}</figure>`}
function mapaVozes(V,titulo){const nome=Object.fromEntries(V.lista.map(v=>[v.id,v.nome]));
  const rels=V.rel.length?V.rel:V.lista.filter(v=>v.id!=="autor").map(v=>({v:v.id,r:"citado",t:""}));
  if(!rels.length)return "";
  return `<figure class="mapa" role="group" aria-label="Mapa das vozes"><figcaption>${titulo||"Com quem o autor dialoga"}</figcaption>
    <div class="vmap" style="--n:${rels.length}"><div class="vhub">Autor do texto</div>
    ${rels.map(r=>`<div class="vedge ${RELC[r.r]||"r-ex"}"><span class="varrow" aria-hidden="true"><i></i><b></b></span><span class="vnode">${esc(nome[r.v]||"")}</span>
      <span class="vrel"><span class="rl">${esc(r.r)}</span>${r.t?`<p>${esc(r.t)}</p>`:""}</span></div>`).join("")}</div></figure>`}
function mapaTempo(ev,S,titulo,raw){const E=raw?(x=>String(x)):esc;const ys=ev.map(x=>parseInt(x.a)).filter(n=>!isNaN(n));if(ev.length<2)return "";
  const span=Math.max(1,Math.max(...ys)-Math.min(...ys));let prev=null;
  const itens=ev.map(x=>{const y=parseInt(x.a);let gap=0,lbl="";
    if(prev!=null&&!isNaN(y)){const d=y-prev;gap=Math.round(Math.min(110,Math.max(10,d/span*260)));lbl=d>0?`+${d} ano${d>1?"s":""}`:"mesmo ano"}
    if(!isNaN(y))prev=y;
    return `<li style="margin-top:${gap}px">${lbl?`<span class="tgap">${lbl}</span>`:""}<span class="ty">${E(x.a)}</span><span class="te">${E(x.e)}${S&&x.p!=null&&S.pars[x.p]?` <span class="pgref">p. ${S.pars[x.p].pg}</span>`:""}</span></li>`});
  return `<figure class="mapa" role="group" aria-label="Linha do tempo"><figcaption>${titulo||"Linha do tempo"} · distâncias proporcionais ao tempo</figcaption><ol class="tline">${itens.join("")}</ol></figure>`}
const ordAno=ev=>ev.slice().sort((a,b)=>(parseInt(a.a)||0)-(parseInt(b.a)||0));
function mapaEstudo(){const m=est.meta;
  return `<figure class="mapa" role="group" aria-label="Mapa do estudo"><figcaption>Mapa do estudo: ${esc(m.titulo)}</figcaption><div class="smap">${est.secoes.map((S,k)=>{const g=S.gen||{},R=S.resp||{};
    const tese=g.arg?g.arg.find((x,j)=>x.r==="tese"&&!sinal(S,"a"+j)):null;
    const vozes=g.vozes?g.vozes.lista.filter(v=>v.id!=="autor").map(v=>v.nome):[];
    const termos=arr(R.gloss).map(x=>x.termo);
    return `${k?'<div class="sline" aria-hidden="true"></div>':""}<div class="snode"><h4>${k+1}. ${esc(S.titulo)} <span class="pgref">p. ${S.pgIni}–${S.pgFim}</span></h4>
      ${tese?`<p class="stese"><b>Tese:</b> ${esc(tese.t)}</p>`:`<p class="note">${S.status==="nova"?"Seção ainda não estudada.":"Sem tese identificada."}</p>`}
      ${vozes.length?`<div class="chips" aria-label="Interlocutores">${vozes.map(v=>`<span>${esc(v)}</span>`).join("")}</div>`:""}
      ${termos.length?`<div class="chips" aria-label="Termos do glossário">${termos.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}</div>`}).join("")}</div></figure>`}
function mapasSecao(S){const g=S.gen||{},out=[];
  if(g.arg){const it=g.arg.filter((x,k)=>!sinal(S,"a"+k));if(it.some(x=>x.r==="tese"))out.push(mapaArg(S,it,`Argumento · ${esc(S.titulo)}`))}
  if(g.vozes){const v=mapaVozes(g.vozes,`Vozes · ${esc(S.titulo)}`);if(v)out.push(v)}
  if(arr(g.crono).length>=3)out.push(mapaTempo(ordAno(g.crono),S,`Linha do tempo · ${esc(S.titulo)}`));
  return out.join("")}
const MAPTOK=`:root{--bg:#F6F8F7;--surface:#FFFFFF;--ink:#17231F;--muted:#56635E;--line:#CBD5D0;--accent:#1550A6;--accent-soft:#E4EDF9;--ok:#2E7D4F;--bad:#B4432F;--v2:#A86A12;--v3:#2F5C9A;--v4:#9A3B63;--f-read:Georgia,serif;--f-mono:Menlo,monospace}
