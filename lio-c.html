function renderProf(){stopTick();if(pf.view!=="turma")pararTurma();
  const cab=`<div class="stack"><span class="eyebrow">Mediador</span><h1>Atividades e grupo</h1>
  ${temSim()?'<div class="row"><button class="btn small" id="simOn">Ver como participante (sem IA)</button><span class="note">Para testar o que o participante vê: sem a aba Mediador e com as perguntas abertas em autoavaliação.</span></div>':""}
  <p class="lead">Transforme um estudo seu numa atividade para os participantes. Antes de publicar, você revisa e corrige o que a IA gerou. ${compartilhado()?"Publicada, a atividade aparece para quem tem acesso a esta página, e os participantes que aceitarem compartilham o progresso com você.":"Nesta versão, a atividade vai para os participantes como arquivo, e eles devolvem um relatório de progresso também em arquivo."}</p></div>`;
  if(!CAP.ready){main.innerHTML=cab+'<p class="note"><span class="spin"></span>Abrindo…</p>';return}
  if(!CAP.db||!CAP.uid){main.innerHTML=cab+vazio("O painel precisa do armazenamento, que não está disponível aqui.");return}
  if(pf.view==="rev")return profRev();
  if(pf.view==="turma")return profTurma();
  if(pf.view==="pac"&&pf.lista&&pf.lista.length)return profPac(cab);
  if(!pf.lista){main.innerHTML=cab+'<p class="note"><span class="spin"></span>Carregando…</p>';carregarProf();return}
  main.innerHTML=cab+`<div class="stack"><h2>Suas atividades</h2>
   ${pf.lista.length?pf.lista.map(a=>`<div class="studyrow"><div class="sr-main"><b>${esc(a.titulo)}</b><span class="note">${a.nSec} ${a.nSec===1?"seção":"seções"} · ${a.revisadas||0} revisada${(a.revisadas||0)===1?"":"s"} · ${a.teste?(a.testeRevisado?"teste revisado":"teste a revisar"):"sem teste"}${a.publicada?" · <b>publicada</b>":""}</span></div>
     <div class="row" id="pa_${a.id}"><button class="btn small primary" data-rv="${a.id}">Revisar</button>${compartilhado()?`<button class="btn small" data-pub="${a.id}">${a.publicada?"Atualizar publicação":"Publicar"}</button>${a.publicada?`<button class="btn small" data-unp="${a.id}">Despublicar</button>`:""}`:""}<button class="btn small" data-exp="${a.id}">Exportar arquivo</button><button class="btn small" data-del="${a.id}">Apagar</button></div></div>`).join("")
   :vazio("Nenhuma atividade ainda.")}
   ${pf.lista.length?'<div class="row"><button class="btn" id="pfPac">Montar pacote para distribuir</button><span class="note">Várias atividades num arquivo só, com capa, versão e termos de uso.</span></div>':""}</div>
  <div class="stack"><h2>Nova atividade</h2>
   ${pf.estudos&&pf.estudos.length?`<div class="field"><label for="pfE">A partir do estudo</label><select id="pfE">${pf.estudos.map(e=>`<option value="${esc(e.id)}">${esc(e.titulo)}</option>`).join("")}</select></div>
   <div class="row"><button class="btn primary" id="pfNova">Criar atividade</button></div><p class="note">O texto e os exercícios do estudo são copiados para a atividade. Suas anotações pessoais não vão junto.</p>`
   :vazio('Crie primeiro um estudo na aba Estudo, com o texto que os participantes vão ler.')}</div>
  ${blocoAulaProf()}
  ${blocoMsgProf()}
  <div class="stack"><h2>Grupo</h2><p class="note">${compartilhado()?"Progresso dos participantes que aceitaram compartilhar.":"Importe os relatórios que os participantes exportarem."}</p>
   <div class="row"><button class="btn" id="pfT">Abrir o painel do grupo</button></div></div>
  <p class="note">Você é responsável pelos direitos de uso dos textos que distribui. Prefira textos de domínio público, de acesso aberto ou trechos permitidos para uso didático.</p>`;
  main.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>abrirAtiv(b.dataset.rv));
  main.querySelectorAll("[data-pub]").forEach(b=>b.onclick=()=>publicarAtiv(b.dataset.pub,b));
  main.querySelectorAll("[data-unp]").forEach(b=>b.onclick=()=>despublicar(b.dataset.unp));
  main.querySelectorAll("[data-exp]").forEach(b=>b.onclick=()=>exportarAtiv(b.dataset.exp));
  main.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;$("#pa_"+id).innerHTML='<span class="note">Apagar esta atividade?</span><button class="btn small" data-y>Apagar</button><button class="btn small" data-n>Cancelar</button>';
    $("#pa_"+id).querySelector("[data-n]").onclick=renderProf;$("#pa_"+id).querySelector("[data-y]").onclick=async()=>{try{const q=await aSecCol(id).get();for(const d of q.docs)await aSecCol(id).doc(d.id).delete();await aRef(id).delete();if(compartilhado())await despublicar(id,true)}catch(e){toast(dbMsg(e))}pf.lista=null;renderProf()}});
  const n=$("#pfNova");if(n)n.onclick=()=>criarAtiv($("#pfE").value);
  $("#pfT").onclick=()=>{pf.view="turma";pf.turma=null;renderProf()};
  const so=$("#simOn");if(so)so.onclick=()=>trocarSim(true);
  const pk=$("#pfPac");if(pk)pk.onclick=()=>{pf.view="pac";renderProf()};
  ligarAulaProf();pintarCfgMsg();
}
async function carregarProf(){if(pf.carregando)return;pf.carregando=true;
  try{const a=await uCol().where("tipo","==","atividade").get();pf.lista=a.docs.map(d=>({id:d.id.slice(5),...clone(d.data())})).sort((x,y)=>String(y.atualizado||"").localeCompare(String(x.atualizado||"")));
    const e=await uCol().where("tipo","==","estudo").get();pf.estudos=e.docs.map(d=>({id:d.id.slice(4),...clone(d.data())})).filter(x=>!x.origem)}
  catch(e){toast(dbMsg(e));pf.lista=[];pf.estudos=[]}
  pf.carregando=false;if(tab==="prof")renderProf()}
async function criarAtiv(eid){const b=$("#pfNova");b.disabled=true;
  try{const m=clone((await mRef(eid).get()).data()),q=await sCol(eid).orderBy("n").get(),id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),now=agora();
    await aRef(id).set({tipo:"atividade",titulo:m.titulo,ref:m.ref||"",pgIni:m.pgIni,pgFim:m.pgFim,nSec:q.size,revisadas:0,publicada:false,teste:m.teste||null,testeRevisado:false,paginasEstimadas:!!m.paginasEstimadas,estudo:eid,criado:now,atualizado:now});
    for(const d of q.docs){const S=clone(d.data());await aSecCol(id).doc(String(S.n)).set({n:S.n,titulo:S.titulo,pgIni:S.pgIni,pgFim:S.pgFim,pars:S.pars,notas:S.notas||[],gen:S.gen||null,perg:S.perg||null,revisada:false})}
    toast("Atividade criada. Revise os exercícios antes de publicar.");pf.lista=null;abrirAtiv(id)}
  catch(e){toast(dbMsg(e));b.disabled=false}}
async function lerAtiv(id){const m=clone((await aRef(id).get()).data()),q=await aSecCol(id).orderBy("n").get();return {id,meta:m,secoes:q.docs.map(d=>clone(d.data()))}}
async function abrirAtiv(id){main.innerHTML='<p class="note"><span class="spin"></span>Abrindo a atividade…</p>';
  try{pf.A=await lerAtiv(id);pf.si=0;pf.view="rev";renderProf()}catch(e){toast(dbMsg(e));pf.view="home";renderProf()}}

/* --- Revisão dos itens gerados --- */
const fld=(k,v,lbl,big)=>big?`<label class="ed"><span>${lbl}</span><textarea data-f="${k}" rows="2">${esc(v)}</textarea></label>`:`<label class="ed"><span>${lbl}</span><input data-f="${k}" value="${esc(v)}"></label>`;
const sel=(k,v,ops,lbl)=>`<label class="ed"><span>${lbl}</span><select data-f="${k}">${ops.map(([o,t])=>`<option value="${esc(o)}" ${o===v?"selected":""}>${esc(t)}</option>`).join("")}</select></label>`;
const item=(grupo,k,inner)=>`<div class="edit" data-g="${grupo}" data-k="${k}"><label class="inc"><input type="checkbox" data-inc checked> Incluir</label>${inner}</div>`;
function profRev(){if(pf.si==="t")return profTeste();const A=pf.A,S=A.secoes[pf.si],g=S.gen,P=arr(S.perg),job=pf.job&&pf.job.n===S.n;
  const vozOps=g&&g.vozes?g.vozes.lista.map(v=>[v.id,v.nome]):[];
  const grupo=(t,n,html,dica)=>`<details class="edg" ${n?"open":""}><summary>${t} <span class="note">(${n})</span></summary>${dica?`<p class="note">${dica}</p>`:""}${html||'<p class="note">Nada gerado.</p>'}</details>`;
  main.innerHTML=`<div class="stack"><button class="linkbtn" id="bk">← Atividades</button><span class="eyebrow">Revisão · ${esc(A.meta.titulo)}</span><h1>${esc(S.titulo)}</h1>
   <div class="subtabs">${A.secoes.map((x,i)=>`<button class="chip" data-si="${i}" aria-pressed="${i===pf.si}">${i+1}${x.revisada?" ✓":""}</button>`).join("")}<button class="chip" data-si="t" aria-pressed="false">Teste${A.meta.testeRevisado?" ✓":""}</button></div>
   <p class="lead">Desmarque o que estiver errado e corrija o texto quando precisar. Só o que estiver marcado vai para os participantes.</p></div>
  ${(!g||!P.length)&&CAP.sample?`<div class="panel">${job?'<b><span class="spin"></span>Preparando…</b>':`<b>Falta preparar ${!g&&!P.length?"os exercícios e as perguntas":!g?"os exercícios":"as perguntas de compreensão"}</b><div class="row">${!g?'<button class="btn primary" id="pgG">Preparar exercícios</button>':""}${!P.length?'<button class="btn" id="pgP">Preparar perguntas</button>':""}</div>`}</div>`:""}
  <div class="stack" id="edArea">
  ${g?grupo("Ideias centrais",g.ideias.length,g.ideias.map((x,k)=>item("ideias",k,`<p class="note-t">${esc(primeira(S.pars[x.i].t))}</p>${fld("ok",x.ok,"Certa")}${fld("no0",x.no[0],"Errada 1")}${fld("no1",x.no[1],"Errada 2")}`)).join(""),"Uma pergunta por parágrafo na leitura ativa."):""}
  ${g?grupo("Frases difíceis",g.lab.length,g.lab.map((x,k)=>item("lab",k,`<p class="note-t">${esc(x.frase)}</p>${fld("ok",x.ok,"Núcleo")}${fld("no0",x.no[0],"Errada 1")}${fld("no1",x.no[1],"Errada 2")}`)).join("")):""}
  ${g&&g.vozes?grupo("Vozes: afirmações",g.vozes.af.length,g.vozes.af.map((x,k)=>item("af",k,`${fld("t",x.t,"Afirmação",true)}${sel("v",x.v,vozOps,"De quem é")}`)).join(""))
    +grupo("Vozes: relações",g.vozes.rel.length,g.vozes.rel.map((x,k)=>item("rel",k,`<p><b>${esc((vozOps.find(o=>o[0]===x.v)||["",""])[1])}</b></p>${sel("r",x.r,RELS.map(r=>[r,r]),"Relação")}${fld("t",x.t,"Resumo",true)}`)).join("")):""}
  ${g&&g.arg?grupo("Argumento",g.arg.length,g.arg.map((x,k)=>item("arg",k,`${fld("t",x.t,"Texto",true)}${sel("r",x.r,Object.entries(PAPEIS),"Papel")}`)).join(""),"Precisa de uma tese."):""}
  ${g&&arr(g.crono).length?grupo("Cronologia",g.crono.length,g.crono.map((x,k)=>item("crono",k,`${fld("a",x.a,"Ano")}${fld("e",x.e,"Acontecimento")}`)).join(""),"A linha do tempo só aparece com 3 ou mais."):""}
  ${g?grupo("Termos sugeridos",g.termos.length,g.termos.map((x,k)=>item("termos",k,`${fld("termo",x.termo,"Termo")}${fld("sentido",x.sentido,"Sentido",true)}`)).join("")):""}
  ${P.length?grupo("Perguntas de compreensão",P.length,P.map((x,k)=>item("perg",k,`${sel("n",x.n,Object.entries(NIVEL),"Nível")}${fld("q",x.q,"Pergunta",true)}${fld("r",x.r,"Referência para o retorno",true)}`)).join("")):""}
  </div>
  <div class="row"><button class="btn primary" id="edSv">Salvar e marcar seção como revisada</button>${pf.si<A.secoes.length-1?'<button class="btn" id="edNx">Próxima seção</button>':""}</div>`;
  $("#bk").onclick=()=>{pf.view="home";pf.lista=null;renderProf()};
  main.querySelectorAll("[data-si]").forEach(b=>b.onclick=()=>{pf.si=b.dataset.si==="t"?"t":+b.dataset.si;profRev();window.scrollTo(0,0)});
  main.querySelectorAll("[data-inc]").forEach(c=>c.onchange=()=>c.closest(".edit").classList.toggle("off",!c.checked));
  const pG=$("#pgG");if(pG)pG.onclick=()=>prepAtiv(S,"gen");
  const pP=$("#pgP");if(pP)pP.onclick=()=>prepAtiv(S,"perg");
  $("#edSv").onclick=()=>salvarRev(S);
  const nx=$("#edNx");if(nx)nx.onclick=()=>{pf.si++;profRev();window.scrollTo(0,0)};
}
async function prepAtiv(S,tipo){pf.job={n:S.n};profRev();
  try{if(tipo==="gen"){const g=await CAP.sample.json(promptSecao(S),{cache:false});S.gen=validar(g,S)}
    else{const g=await CAP.sample.json(promptPerg(S),{cache:false});S.perg=validarPerg(g,S)}
    S.revisada=false;await aSecCol(pf.A.id).doc(String(S.n)).update({gen:S.gen,perg:S.perg||null,revisada:false})}
  catch(e){toast(sampleMsg(e))}
  pf.job=null;if(tab==="prof"&&pf.view==="rev")profRev()}
function lerGrupo(nome){const out=[];main.querySelectorAll(`.edit[data-g="${nome}"]`).forEach(el=>{if(!el.querySelector("[data-inc]").checked)return;const o={k:+el.dataset.k};el.querySelectorAll("[data-f]").forEach(f=>o[f.dataset.f]=f.value.trim());out.push(o)});return out}
async function salvarRev(S){const g=S.gen;
  if(g){g.ideias=lerGrupo("ideias").filter(x=>x.ok&&x.no0&&x.no1).map(x=>({...g.ideias[x.k],ok:x.ok,no:[x.no0,x.no1]}));
    g.lab=lerGrupo("lab").filter(x=>x.ok&&x.no0&&x.no1).map(x=>({...g.lab[x.k],ok:x.ok,no:[x.no0,x.no1]}));
    if(g.vozes){const af=lerGrupo("af").filter(x=>x.t).map(x=>({...g.vozes.af[x.k],t:x.t,v:x.v}));const rel=lerGrupo("rel").filter(x=>x.t).map(x=>({...g.vozes.rel[x.k],r:x.r,t:x.t}));
      g.vozes=af.length>=2&&new Set(af.map(x=>x.v)).size>=2?{...g.vozes,af,rel}:null}
    if(g.arg){const a=lerGrupo("arg").filter(x=>x.t).map(x=>({...g.arg[x.k],t:x.t,r:x.r}));g.arg=a.length>=3&&a.some(x=>x.r==="tese")?a:null}
    if(arr(g.crono).length){const c=lerGrupo("crono").filter(x=>x.a&&x.e).map(x=>({...g.crono[x.k],a:x.a,e:x.e}));g.crono=c.length>=3?c:[]}
    g.termos=lerGrupo("termos").filter(x=>x.termo&&x.sentido).map(x=>({...g.termos[x.k],termo:x.termo,sentido:x.sentido}))}
  if(arr(S.perg).length)S.perg=lerGrupo("perg").filter(x=>x.q&&x.r).map(x=>({...S.perg[x.k],n:x.n,q:x.q,r:x.r}));
  S.revisada=true;
  try{await aSecCol(pf.A.id).doc(String(S.n)).update({gen:S.gen,perg:S.perg||null,revisada:true});
    const rv=pf.A.secoes.filter(x=>x.revisada).length;pf.A.meta.revisadas=rv;await aRef(pf.A.id).update({revisadas:rv,atualizado:agora()});
    toast(pf.A.meta.publicada?"Revisão salva. Use “Atualizar publicação” para os participantes receberem a correção.":"Seção revisada.")}
  catch(e){toast(dbMsg(e))}
  profRev()}

/* --- Publicar e exportar --- */
async function publicarAtiv(id,btn){if(btn)btn.disabled=true;
  try{const A=await lerAtiv(id);const pend=A.secoes.filter(S=>!S.revisada).length;
    const m=A.meta,pub={titulo:m.titulo,ref:m.ref,pgIni:m.pgIni,pgFim:m.pgFim,nSec:A.secoes.length,paginasEstimadas:!!m.paginasEstimadas,teste:m.teste||null,publicada:true,atualizado:agora(),versao:agora()};
    await CAP.db.doc("atividades/"+id).set(pub);
    for(const S of A.secoes)await CAP.db.doc(`atividades/${id}/secoes/${S.n}`).set({n:S.n,titulo:S.titulo,pgIni:S.pgIni,pgFim:S.pgFim,pars:S.pars,notas:S.notas||[],gen:S.gen||null,perg:S.perg||null});
    await aRef(id).update({publicada:true,atualizado:agora()});
    toast(pend?`Publicada, mas ${pend} seç${pend>1?"ões ainda não foram revisadas":"ão ainda não foi revisada"}.`:"Atividade publicada para o grupo.")}
  catch(e){toast(dbMsg(e))}
  pf.lista=null;renderProf()}
async function despublicar(id,silencio){try{const r=CAP.db.doc("atividades/"+id);const s=await r.get();if(s.exists)await r.update({publicada:false});await aRef(id).update({publicada:false}).catch(()=>{});if(!silencio)toast("A atividade saiu da lista dos participantes. Quem já começou continua com a sua cópia.")}catch(e){if(!silencio)toast(dbMsg(e))}
  if(!silencio){pf.lista=null;renderProf()}}
async function exportarAtiv(id){try{const A=await lerAtiv(id),m=A.meta;
    await baixarJSON(`Atividade - ${nomeArquivo(m.titulo)}.json`,{app:"lio-ciencias",tipo:"atividade",versao:1,atividade:{id,versao:m.atualizado||agora(),titulo:m.titulo,ref:m.ref,pgIni:m.pgIni,pgFim:m.pgFim,paginasEstimadas:!!m.paginasEstimadas,teste:m.teste||null,
      secoes:A.secoes.map(S=>({n:S.n,titulo:S.titulo,pgIni:S.pgIni,pgFim:S.pgFim,pars:S.pars,notas:S.notas||[],gen:S.gen||null,perg:S.perg||null}))}})}
  catch(e){toast(dbMsg(e))}}

/* --- Lado do aluno: atividades --- */
async function atividadesPublicadas(){if(!compartilhado())return [];try{const s=await CAP.db.collection("atividades").where("publicada","==",true).get();return s.docs.map(d=>({id:d.id,...clone(d.data())}))}catch(e){return []}}
async function comecarAtiv(meta,secoes,op){op=op||{};
  const ja=(est.list||[]).find(x=>x.origem&&x.origem.aid===meta.id);
  if(ja&&op.abrir===false)return;
  if(ja){const nova=meta.versao||meta.atualizado||"";if(nova&&nova>String(ja.origem.versao||"")){est.pendente={meta,secoes}}return estOpen(ja.id)}
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),now=agora(),status={};secoes.forEach(S=>status[S.n]="nova");
  await mRef(id).set({tipo:"estudo",titulo:meta.titulo,ref:meta.ref||"",pgIni:meta.pgIni,pgFim:meta.pgFim,nSec:secoes.length,status,sintese:"",paginasEstimadas:!!meta.paginasEstimadas,origem:{aid:meta.id,titulo:meta.titulo,versao:meta.versao||meta.atualizado||now},compartilhar:false,teste:meta.teste&&Array.isArray(meta.teste.itens)?meta.teste:null,pacote:op.pacote?pacLimpo(op.pacote):null,criado:now,atualizado:now});
  for(const S of secoes)await sCol(id).doc(String(S.n)).set({n:S.n,titulo:S.titulo,pgIni:S.pgIni,pgFim:S.pgFim,pars:S.pars,notas:S.notas||[],gen:S.gen||null,perg:S.perg||null,resp:{},status:"nova",step:"mapa"});
  if(op.abrir===false){(est.list=est.list||[]).push({id,origem:{aid:meta.id,versao:meta.versao||meta.atualizado||now}});return}
  estOpen(id)}
async function comecarPublicada(aid){main.innerHTML='<p class="note"><span class="spin"></span>Preparando a atividade…</p>';
  try{const m=await CAP.db.doc("atividades/"+aid).get();if(!m.exists){toast("Atividade não encontrada.");return estGo("lib")}
    const q=await CAP.db.collection(`atividades/${aid}/secoes`).orderBy("n").get();await comecarAtiv({id:aid,...clone(m.data())},q.docs.map(d=>clone(d.data())))}
  catch(e){toast(dbMsg(e));estGo("lib")}}
async function importarAtiv(f){try{const d=await lerArquivoJSON(f);
    if(d&&d.app==="lio-ciencias"&&d.tipo==="pacote"){const ok=d.pacote&&typeof d.pacote==="object"&&Array.isArray(d.atividades)&&d.atividades.length&&d.atividades.every(a=>a&&typeof a.id==="string"&&Array.isArray(a.secoes)&&a.secoes.every(S=>Array.isArray(S.pars)));
      if(!ok){toast("O pacote está incompleto ou corrompido.");return}
      const P=pacLimpo(d.pacote);if(!P.titulo)P.titulo="Pacote sem título";return estGo("pac",{pac:{pacote:P,atividades:d.atividades}})}
    if(!d||d.app!=="lio-ciencias"||d.tipo!=="atividade"||!d.atividade||!Array.isArray(d.atividade.secoes)){toast("Este arquivo não é uma atividade da LIO.");return}
    const a=d.atividade;if(!a.secoes.every(S=>Array.isArray(S.pars))){toast("A atividade está incompleta.");return}await comecarAtiv(a,a.secoes)}
  catch(e){toast("Não foi possível ler o arquivo da atividade.")}}
async function blocoTurmaAluno(){const el=$("#turmaAluno");if(!el)return;
  const pubs=await atividadesPublicadas();if(est.view!=="lib"||!$("#turmaAluno"))return;
  el.innerHTML=`<h2>Atividades do grupo</h2>${pubs.length?pubs.map(a=>{const ja=(est.list||[]).find(x=>x.origem&&x.origem.aid===a.id);
      return `<div class="studyrow"><div class="sr-main"><b>${esc(a.titulo)}</b><span class="note">${a.nSec} ${a.nSec===1?"seção":"seções"}${a.ref?" · "+esc(a.ref):""}</span></div><div class="row"><button class="btn small ${ja?"":"primary"}" data-at="${esc(a.id)}">${ja?"Continuar":"Começar"}</button></div></div>`}).join("")
    :`<p class="note">${compartilhado()?"Nenhuma atividade publicada pelo mediador nesta página.":""}</p>`}

async function verificarVersao(){const m=est.meta;if(!m||!m.origem||est.pendente&&est.pendente.meta.id===m.origem.aid)return;if(!compartilhado())return;
  try{const d=await CAP.db.doc("atividades/"+m.origem.aid).get();if(!d.exists)return;const a=d.data(),v=a.versao||a.atualizado||"";
    if(v&&v>String(m.origem.versao||"")&&est.view==="estudo"&&est.meta===m){est.pendente={meta:{id:m.origem.aid,...clone(a)},secoes:null};const el=$("#vbloco");if(el){el.outerHTML=blocoVersao();ligarVersao()}}}catch(e){}}
function blocoVersao(){const p=est.pendente,m=est.meta;if(!p||!m.origem||p.meta.id!==m.origem.aid)return '<div id="vbloco"></div>';
  const v=p.meta.versao||p.meta.atualizado;
  return `<div class="panel" id="vbloco"><b>Há uma versão mais nova desta atividade</b><p>${p.meta.pacote?"O autor do pacote":"O mediador"} atualizou a atividade${v?` em ${new Date(v).toLocaleDateString("pt-BR")}`:""}. Ao receber, o texto e os exercícios são trocados pelos novos. Suas etiquetas, respostas, glossário, observações e testes já feitos continuam.</p>
   <div class="row"><button class="btn primary" id="vok">Receber a atualização</button><button class="btn small" id="vno">Agora não</button></div></div>`}
function ligarVersao(){const ok=$("#vok");if(!ok)return;ok.onclick=receberVersao;$("#vno").onclick=()=>{est.pendente=null;$("#vbloco").outerHTML='<div id="vbloco"></div>'}}
async function receberVersao(){const p=est.pendente,m=est.meta;$("#vok").disabled=true;
  try{let secoes=p.secoes;if(!secoes){const q=await CAP.db.collection(`atividades/${p.meta.id}/secoes`).orderBy("n").get();secoes=q.docs.map(d=>clone(d.data()))}
    for(const N of secoes){const S=est.secoes.find(x=>x.n===N.n);
      if(S){Object.assign(S,{titulo:N.titulo,pgIni:N.pgIni,pgFim:N.pgFim,pars:N.pars,notas:N.notas||[],gen:N.gen||null,perg:N.perg||null});
        await sCol(est.id).doc(String(S.n)).update({titulo:S.titulo,pgIni:S.pgIni,pgFim:S.pgFim,pars:S.pars,notas:S.notas,gen:S.gen,perg:S.perg})}
      else{const novo={n:N.n,titulo:N.titulo,pgIni:N.pgIni,pgFim:N.pgFim,pars:N.pars,notas:N.notas||[],gen:N.gen||null,perg:N.perg||null,resp:{},status:"nova",step:"mapa"};
        await sCol(est.id).doc(String(N.n)).set(novo);est.secoes.push(novo);m.status=Object.assign({},m.status,{[N.n]:"nova"})}}
    est.secoes.sort((a,b)=>a.n-b.n);
    const upd={origem:Object.assign({},m.origem,{versao:p.meta.versao||p.meta.atualizado||agora()}),nSec:est.secoes.length,status:m.status||{},titulo:p.meta.titulo||m.titulo,ref:p.meta.ref||m.ref||""};if(p.meta.pacote)upd.pacote=pacLimpo(p.meta.pacote);
    let aviso="";const fez=Object.keys(m.resultados||{}).length>0;
    if(p.meta.teste&&Array.isArray(p.meta.teste.itens)){if(!fez)upd.teste=p.meta.teste;else aviso=" O teste foi mantido como estava, porque você já fez uma etapa dele."}
    Object.assign(m,upd);await qw("meta",()=>mRef(est.id).update(upd));

function resumoAtiv(){const m=est.meta;return {aid:m.origem.aid,titulo:m.titulo,atualizado:agora(),nome:(load("meuNome","")||m.nome||"").trim(),

  montarPainel();msgAtualizar()}

function msgBadge(){const b=$("#msgBadge");if(!b)return;const n=MSG.on?totalNaoLidas():0;b.textContent=n>99?"99+":String(n);b.hidden=!n;b.setAttribute("aria-label",n+" não lida"+(n===1?"":"s"))}
async function msgMarcar(){if(!MSG.on||!painelAberto()||(MSG.vendoLista&&!(painelLargo&&innerWidth>720))||document.hidden||!MSG.canWrite)return;
  const ms=msgsDe(MSG.conv);if(!ms.length)return;const ult=ms[ms.length-1].ts;if((MSG.myReads[MSG.conv]||0)>=ult)return;
  MSG.myReads[MSG.conv]=ult;MSG.pend[MSG.conv]=ult;msgBadge();if(MSG.grav)return;MSG.grav=true;
  try{while(Object.keys(MSG.pend).length){const tudo=Object.assign({},MSG.myReads);MSG.pend={};await CAP.db.doc("msg/dados/leitura/"+MSG.me).set({reads:tudo})}}catch(e){}
  MSG.grav=false}

      const head=!block&&l.t.length<150&&(l.h>=body*1.12||(l.t.length<90&&!TERM.test(l.t)&&!/,$/.test(l.t)&&gapB>typ*1.5&&gapA>typ*1.3&&/^[A-ZÀ-Ý0-9]/.test(l.t)));

function partirLongo(t){
  if(t.length<=3500)return [t];
  const fr=t.match(/[^.!?]+[.!?]+["”»)]?\s*|[^.!?]+$/g)||[t],out=[];let c="";
  for(const f of fr){if(c.length+f.length>2200&&c.length>800){out.push(c.trim());c=""}c+=f}
  if(c.trim())out.push(c.trim());return out;
}
function achatar(ext){
  const pars=[],notas=[];
  for(let p=ext.from;p<=ext.to;p++){const pg=ext.pages[p];if(!pg)continue;
    pg.pars.forEach((x,i)=>{const t=String(x.t||"").replace(/\s+/g," ").trim();if(t.length<3)return;const last=pars[pars.length-1];
      if(x.h&&last&&last.h&&last.pg===p){last.t+=" "+t;return}
      if(i===0&&last&&!last.h&&!x.h&&!x.fig&&!last.fig&&!TERM.test(last.t)){last.t=joinL(last.t,t);return}
      const o={t,pg:p};if(x.h)o.h=true;if(x.q)o.q=true;if(x.fig)o.fig=x.fig;pars.push(o)});
    arr(pg.notes).forEach(n=>{const t=String(n).trim();if(t)notas.push({t,pg:p})});
  }
  const out=[];for(const p of pars){if(p.h||p.fig){out.push(p);continue}for(const t of partirLongoTex(p.t))out.push({...p,t})}

}
function seccionar(pars,notas){
  const S=[];let cur=null,len=0;
  const novo=t=>{cur={titulo:t||"",pars:[]};S.push(cur);len=0};
  for(const p of pars){
    if(p.h){if(!cur||len>=1500)novo(p.t);else if(!cur.titulo)cur.titulo=p.t;else cur.pars.push(p);continue}
    if(!cur)novo("");
    if(len+p.t.length>7000&&len>=2500)novo("");
    cur.pars.push(p);len+=p.t.length;
  }
  let out=S.filter(s=>s.pars.some(p=>!p.h));
  if(out.length>1){const last=out[out.length-1],tam=last.pars.reduce((s,p)=>s+p.t.length,0);
    if(tam<1200){out[out.length-2].pars.push(...(last.titulo?[{t:last.titulo,pg:last.pars[0].pg,h:true}]:[]),...last.pars);out.pop()}}
  out.forEach((s,i)=>{const pg=s.pars.map(p=>p.pg);s.pgIni=Math.min(...pg);s.pgFim=Math.max(...pg);s.titulo=s.titulo||("Trecho "+(i+1));s.notas=notas.filter(n=>n.pg>=s.pgIni&&n.pg<=s.pgFim);s.n=i});
  return out;
}

const corpo=S=>S.pars.map((p,i)=>p.h||p.fig||p.del?-1:i).filter(i=>i>=0);

  ${!S.gen&&CAP.sample?`<div class="panel">${job?`<div class="espera">${masc("m-espera")}<b><span class="spin"></span>Preparando os exercícios desta seção…</b></div><p class="note">Leva de 30 segundos a 2 minutos. Você pode continuar lendo enquanto isso.</p><div class="row"><button class="btn small" id="stop">Parar</button></div>`
   :`<b>Exercícios desta seção</b><p>O Claude prepara as perguntas a partir deste trecho, e a página confere cada frase citada contra o texto antes de usar. Leva de 30 segundos a 2 minutos e usa a sua conta Claude.</p>${S._erro?`<p class="note" style="color:var(--bad)">A última tentativa falhou: ${esc(S._erro)}</p>`:""}<div class="row"><button class="btn primary" id="gen">${S._erro?"Tentar de novo":"Preparar exercícios"}</button></div>`}</div>`:""}
  <div class="stack" id="st"></div>`;
  $("#bk").onclick=()=>estGo("estudo");
  main.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>abrirPasso(b.dataset.p));
  {const tr=main.querySelector(".trilha"),tp=tr&&tr.querySelector('[aria-pressed="true"]');if(tp&&tr.scrollWidth>tr.clientWidth){const a=tr.getBoundingClientRect(),b=tp.getBoundingClientRect();tr.scrollLeft+=b.left-a.left-(a.width-b.width)/2}}
  if($("#gen"))$("#gen").onclick=()=>gerar(S);

    if(!S.gen){el.innerHTML=vazio("Esta etapa usa os exercícios da seção, que ainda não foram preparados. "+(CAP.sample?"Use o botão “Preparar exercícios” acima.":semGen()));return}

  ({mapa:pMapa,leitura:pLeitura,formulas:pFormulas,figuras:pFiguras,deducao:pDeducao,compreensao:pComp,resolver:pResolver,fecho:pFecho})[cur](S,$("#st"));

function passoFeito(S,id){const R=S.resp||{},nb=corpo(S).length,ne=Object.keys(R.etq||{}).filter(k=>R.etq[k]).length;
  return id==="mapa"?(ne>0||S.status==="concluida"):id==="leitura"?nb>0&&ne>=nb:id==="formulas"?!!R.formulas:id==="figuras"?!!R.figuras:id==="deducao"?!!R.deducao:id==="resolver"?arr(R.resolv).some(x=>x&&x.fim):
    id==="compreensao"?arr(S.perg).length>0&&Object.keys(R.perg||{}).length>=arr(S.perg).length:id==="fecho"?S.status==="concluida":false}
function proximoPasso(S){const ps=passos(S).map(x=>x[0]),i=ps.indexOf(est.step);abrirPasso(ps[Math.min(i+1,ps.length-1)])}

/* --- Geração e verificação --- */

/* Etiqueta com IA: primeiro o estudante tenta, depois compara */
function promptEtq(S,i){return `Leia o parágrafo abaixo e responda em duas linhas, em português do Brasil. Se o parágrafo for principalmente uma fórmula, a etiqueta diz em palavras o que a fórmula relaciona (por exemplo: energia cinética cresce com massa e velocidade ao quadrado).
ETIQUETA: a ideia central do parágrafo em 3 a 8 palavras, com as próprias palavras, sem copiar uma frase inteira do texto e sem ponto final
TRECHO: o trecho do parágrafo que mais sustenta essa ideia, copiado exatamente como está no texto, com 5 a 25 palavras

Responda somente com essas duas linhas, sem aspas e sem explicação.

PARÁGRAFO:
${S.pars[i].t}`}
function lerEtqIA(t){const L=String(t||"").split(/\n/).map(l=>l.trim()).filter(Boolean);
  const e=L.find(l=>/^\**\s*etiqueta\s*\**\s*:/i.test(l))||L.find(l=>!/^\**\s*trecho\s*\**\s*:/i.test(l))||"";
  const r=L.find(l=>/^\**\s*trecho\s*\**\s*:/i.test(l))||"";
  return {tag:limparEtq(e.replace(/^\**\s*etiqueta\s*\**\s*:\s*/i,"")),trecho:r.replace(/^\**\s*trecho\s*\**\s*:\s*/i,"").replace(/^["“'«]+|["”'»]+$/g,"").trim()}}
/* Marcador: localização da ideia. Coincidências ÷ palavras marcadas por um ou pelos dois */
const tokW=t=>tokTex(t);
function parMarcavel(t,U,A){let k=0;return tokW(t).map(x=>{if(!x||/^\s+$/.test(x))return esc(x);const c=U.has(k)&&A.has(k)?"mb":U.has(k)?"mu":A.has(k)?"ma":"";return `<span class="w${c?" "+c:""}" data-k="${k++}">${esc(x)}</span>`}).join("")}
function compactPar(t){const C=[];let k=0;tokW(t).forEach(x=>{if(!x||/^\s+$/.test(x))return;const w=norm(x);if(w)C.push({k,w});k++});return C}
function trechoIdx(par,tre){const C=compactPar(par),T=String(tre||"").split(/\s+/).map(norm).filter(Boolean),L=T.length;if(L<2||!C.length)return [];
  const faixa=(a,b)=>{const out=[];for(let k=C[a].k;k<=C[b].k;k++)out.push(k);return out};
  for(let s0=0;s0+L<=C.length;s0++){let ok=true;for(let j=0;j<L;j++)if(C[s0+j].w!==T[j]){ok=false;break}if(ok)return faixa(s0,s0+L-1)}
  const g=Math.min(3,L),ini=[],fim=[];
  for(let s0=0;s0+g<=C.length;s0++){if(T.slice(0,g).every((x,j)=>C[s0+j].w===x))ini.push(s0);if(T.slice(L-g).every((x,j)=>C[s0+j].w===x))fim.push(s0+g-1)}
  for(const a of ini)for(const b of fim)if(b>=a&&b-a+1<=2*L)return faixa(a,b);return []}
function copiaIdx(par,tag){const C=compactPar(par),T=String(tag||"").split(/\s+/).map(norm).filter(Boolean),out=new Set();
  for(let s0=0;s0<C.length;s0++)for(let t0=0;t0<T.length;t0++){let n=0;while(s0+n<C.length&&t0+n<T.length&&C[s0+n].w===T[t0+n])n++;if(n>=3)for(let j=0;j<n;j++)out.add(C[s0+j].k)}
  return [...out]}
function locCalc(u,a){const U=new Set(u),A=new Set(a);let c=0;U.forEach(k=>{if(A.has(k))c++});const uni=U.size+A.size-c;return {u:U.size,a:A.size,c,pct:uni?Math.round(100*c/uni):0}}
function locTexto(L){return `<b>Localização da ideia: ${L.pct}%</b> · você marcou ${L.u} ${L.u===1?"palavra":"palavras"}, a IA ${L.a}, coincidiram ${L.c}.`}
let mkSelOn=false;
function ligarMarcador(S,i,R){const M=R.marc[i],box=$("#parTx");if(!box)return null;let U=new Set(M.u||[]),A=new Set(M.a||[]);
  const redraw=()=>{box.querySelectorAll(".w").forEach(sp=>{const k=+sp.dataset.k;sp.className="w"+(U.has(k)&&A.has(k)?" mb":U.has(k)?" mu":A.has(k)?" ma":"")});
    M.u=[...U];M.a=[...A];["#mkLegA","#mkLegA2"].forEach(id=>{const e=$(id);if(e)e.hidden=!A.size});const lp=$("#mkLimpa");if(lp)lp.hidden=!U.size};
  const marcarSel=()=>{const sel=window.getSelection();if(!sel||sel.isCollapsed||!box.contains(sel.anchorNode)&&!box.contains(sel.focusNode))return false;
    box.querySelectorAll(".w").forEach(sp=>{if(sel.containsNode(sp,true))U.add(+sp.dataset.k)});sel.removeAllRanges();const b=$("#mkSel");if(b)b.hidden=true;redraw();return true};
  box.onmouseup=()=>{setTimeout(marcarSel,0)};
  box.onclick=e=>{const sel=window.getSelection();if(sel&&!sel.isCollapsed)return;const sp=e.target.closest(".w");if(!sp)return;const k=+sp.dataset.k;U.has(k)?U.delete(k):U.add(k);redraw()};
  const bs=$("#mkSel");if(bs)bs.onclick=marcarSel;
  if(!mkSelOn){mkSelOn=true;document.addEventListener("selectionchange",()=>{const b=$("#mkSel"),bx=$("#parTx");if(!b||!bx)return;const sel=window.getSelection();b.hidden=!(sel&&!sel.isCollapsed&&(bx.contains(sel.anchorNode)||bx.contains(sel.focusNode)))})}
  const lp=$("#mkLimpa");if(lp)lp.onclick=()=>{U.clear();redraw()};
  redraw();
  return {u:()=>[...U],setA:a=>{A=new Set(a);redraw()},addU:a=>{a.forEach(k=>U.add(k));redraw()}}}
function limparEtq(t){let x=String(t||"").split(/\n/).map(l=>l.trim()).filter(Boolean)[0]||"";x=x.replace(/^(etiqueta|ideia central)\s*:\s*/i,"").replace(/^["“'«]+|["”'»]+$/g,"").replace(/[.;]+$/,"").trim();
  const w=x.split(/\s+/);return w.length>10?w.slice(0,10).join(" "):x}
function origemEtq(S,i,final){const g=est.sug&&est.sug.k===S.n+"_"+i?est.sug:null;if(!g)return ((S.resp.eorig||{})[i])||"eu";
  if(norm(final)===norm(g.txt))return "ia";const sv=S.resp.marc&&S.resp.marc[i]&&S.resp.marc[i].snap;return g.antes||sv&&sv.inval?"misto":"eu"}
function ligarEtqIA(S,i,mk){const box=$("#eiaBox"),bc=$("#eia"),bs=$("#eiaSos");if(!box)return;const tag=$("#tag"),k=S.n+"_"+i,M=S.resp.marc[i];
  const mostrar=()=>{const g=est.sug;if(!g||g.k!==k){box.innerHTML="";return}
    if(g.antes){box.innerHTML=`<div class="fb"><b>Sugestão da IA colocada no campo.</b> Antes de guardar, tente reescrever com as suas palavras: é isso que fixa a ideia. Se guardar como está, a etiqueta fica marcada como da IA.</div>`;return}
    const sn=M.snap,lt=!sn||sn.inval?(sn&&sn.inval?'<span class="note">Este parágrafo começou com uma sugestão da IA: não há Localização da ideia aqui.</span>':""):!g.a||!g.a.length?'<span class="note">A IA não indicou um trecho reconhecível no parágrafo; sem Localização da ideia desta vez.</span>':!sn.u.length?'<span class="note">Para ver a Localização da ideia, marque no parágrafo, antes de comparar, as palavras de onde tirou a sua etiqueta.</span>':`<span class="loc">${locTexto(locCalc(sn.u,g.a))}</span><span class="note">Em verde, o trecho que a IA usou; em azul, onde vocês coincidiram. A marcação da IA é uma referência, não um gabarito.</span>`;
    box.innerHTML=`<div class="fb stack" style="gap:6px"><span><b>Sua:</b> ${esc(tag.value.trim())}</span><span><b>IA:</b> ${esc(g.txt)}</span>${lt}
      <span class="note">A ideia é a mesma? Se a sua deixou algo importante de fora, ajuste. Se as duas dizem o mesmo, fique com a sua.</span>
      <div class="row"><button class="btn small primary" id="eiaMin">Manter a minha</button><button class="btn small" id="eiaUsa">Usar a da IA</button><button class="btn small" id="eiaEd">Editar a partir da IA</button></div></div>`;
    $("#eiaMin").onclick=()=>{box.innerHTML='<p class="note">Etiqueta mantida. Ela conta como sua.</p>';tag.focus()};
    $("#eiaUsa").onclick=()=>{tag.value=g.txt;tag.oninput();box.innerHTML='<p class="note">Etiqueta da IA no campo. Ela fica marcada como da IA.</p>'};
    $("#eiaEd").onclick=()=>{tag.value=g.txt;tag.oninput();g.antes=true;box.innerHTML='<p class="note">Edite a sugestão com as suas palavras.</p>';tag.focus()}};
  const pedir=async antes=>{if(!CAP.sample)return;bc.disabled=true;bs.disabled=true;box.innerHTML='<p class="note"><span class="spin"></span>Lendo o parágrafo…</p>';
    try{const r=await CAP.sample(promptEtq(S,i),{modelTier:"quick",maxTokens:160,cache:false});const lr=lerEtqIA(r&&r.text),t=lr.tag;if(!t)throw {code:"empty_completion"};
      const ia=trechoIdx(S.pars[i].t,lr.trecho);
      if(!M.snap)M.snap=antes?{inval:true}:{u:mk?mk.u():[]};
      est.sug={k,txt:t,antes,a:ia};if(mk)mk.setA(ia);
      const lc=M.snap&&!M.snap.inval&&M.snap.u.length&&ia.length?locCalc(M.snap.u,ia):null;
      logEv("etqia",{est:est.id,sec:S.n,i,modo:antes?"sugestao":"comparar",loc:lc?lc.pct:null});salvarResp(S);
      if(antes){tag.value=t;tag.oninput()}mostrar()}
    catch(e){box.innerHTML=`<p class="note" style="color:var(--bad)">${esc(sampleMsg(e))}</p>`}
    bc.disabled=!tag.value.trim();bs.disabled=false};
  bc.onclick=()=>{if(tag.value.trim())pedir(false)};bs.onclick=()=>pedir(!tag.value.trim());mostrar()}

/* 2 · Leitura ativa */
function pLeitura(S,el){const b=corpo(S),R=S.resp;R.etq=R.etq||{};R.gloss=arr(R.gloss);
  if(est.li>b.length)est.li=b.length;
  const barL=()=>navBar(b.length,est.li,k=>!!R.etq[b[k]],k=>`Parágrafo ${k+1} · p. ${S.pars[b[k]].pg}${R.etq[b[k]]?" · "+R.etq[b[k]]:""}`,"Resumo da seção");
  const irPara=k=>{pararVoz();est.li=Math.max(0,Math.min(k,b.length));R.li=est.li;est.lph="read";est.verSec=false;est.sug=null;salvarResp(S);pLeitura(S,el);
    const t=el.querySelector(".steps.nav");if(t&&t.getBoundingClientRect().top<0)t.scrollIntoView({block:"start"})};
  const ligarNav=()=>{el.querySelectorAll("[data-nav]").forEach(x=>x.onclick=()=>irPara(+x.dataset.nav));

/* 3 · Frases difíceis */
function realcar(frase,nuc){const set=new Set(nuc.split(/\s+/).map(norm).filter(w=>w.length>=3));
  return frase.split(/(\s+)/).map(w=>set.has(norm(w))?`<mark class="core">${esc(w)}</mark>`:esc(w)).join("")}
function pFrases(S,el){const L=S.gen.lab.filter((x,k)=>!sinal(S,"l"+k));
  if(est.fi>=L.length){S.resp.frases={c:est.fr.c,t:est.fr.t};salvarResp(S);
    el.innerHTML=`<div class="fb">${est.fr.t?`Você achou o núcleo de ${est.fr.c} de ${est.fr.t} frases.`:"Nenhuma frase restante."} Ao ler, procure primeiro o verbo principal e trate o que está entre vírgulas como desvio.</div><div class="row"><button class="btn primary" id="nx">Próxima etapa</button></div>`;
    $("#nx").onclick=()=>proximoPasso(S);return}
  const X=L[est.fi],k=S.gen.lab.indexOf(X),opts=shuffle([X.ok,...X.no]).map(esc);
  el.innerHTML=`<p class="lead">Frases longas tiradas desta seção. Encontre o núcleo: quem faz o quê.</p>${stepsBar(L.length,est.fi)}<div class="passage"><p id="fr">${esc(X.frase)}</p></div><p class="q">Qual é o núcleo desta frase?</p>${optsHTML(opts)}<div id="fb" aria-live="polite"></div>`;
  bindOpts(opts,esc(X.ok),right=>{est.fr.t++;if(right)est.fr.c++;logEv("frase",{est:est.id,sec:S.n,certo:right});$("#fr").innerHTML=realcar(X.frase,X.ok);
    $("#fb").innerHTML=`<div class="stack"><div class="fb"><b class="${right?"ok":"bad"}">${right?"Isso.":"Não é o núcleo."}</b> As palavras do núcleo estão marcadas na frase.</div><div class="row"><button class="btn primary" id="nx">Continuar</button></div>${botaoSinal("l"+k)}</div>`;
    const nx=()=>{est.fi++;pFrases(S,el)};$("#nx").onclick=nx;ligarSinal(S,el,nx)});
}

/* 4 · Vozes */
function pVozes(S,el){const V=S.gen.vozes,nome=Object.fromEntries(V.lista.map(x=>[x.id,x.nome]));
  const af=V.af.map((x,k)=>({...x,k})).filter(x=>!sinal(S,"v"+x.k));
  const mapa=()=>mapaVozes(V);
  el.innerHTML=`<p class="lead">De memória: de quem é cada ideia? Se precisar, abra o trecho, mas tente antes sem ele.</p>
  <details><summary>Mostrar o trecho</summary><div class="passage" style="margin-top:8px">${S.pars.map(p=>p.h?`<p class="subtitle">${esc(p.t)}</p>`:`<p>${esc(p.t)}</p>`).join("")}</div></details>
  <div>${af.map(x=>`<div class="claim"><span class="t">${esc(x.t)}</span><div class="roles">${V.lista.map(v=>`<button class="chip" data-c="${x.k}" data-v="${esc(v.id)}" aria-pressed="${est.va[x.k]===v.id}" ${est.vok?"disabled":""}>${esc(v.nome)}</button>`).join("")}</div><span class="res">${est.vok?(est.va[x.k]===x.v?'<b style="color:var(--ok)">Certo.</b>':`<b style="color:var(--bad)">É de ${esc(nome[x.v])}.</b>`)+(x.p!=null?pg(S,x.p):""):""}</span>${est.vok?botaoSinal("v"+x.k):""}</div>`).join("")}</div>
  ${est.vok?`${mapa()}<div class="row"><button class="btn primary" id="nx">Próxima etapa</button></div>`:`<div class="row"><button class="btn primary" id="chk" ${af.every(x=>est.va[x.k])?"":"disabled"}>Conferir</button></div>`}`;
  el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{est.va[b.dataset.c]=b.dataset.v;pVozes(S,el)});
  if($("#chk"))$("#chk").onclick=()=>{est.vok=true;const c=af.filter(x=>est.va[x.k]===x.v).length;S.resp.vozes={c,t:af.length};logEv("vozes",{est:est.id,sec:S.n,c,tt:af.length});salvarResp(S);pVozes(S,el)};
  if($("#nx"))$("#nx").onclick=()=>proximoPasso(S);
  ligarSinal(S,el,()=>pVozes(S,el));
}

/* 5 · Argumento */
function argView(S,itens){const g=r=>itens.filter(x=>x.r===r);
  return `<div class="argview">${["tese","premissa","evidencia","conclusao"].map(r=>g(r).length?`<div><span class="role">${g(r).length>1?plural(PAPEIS[r]):PAPEIS[r]}</span>${g(r).map(x=>`<p>${esc(x.t)}${x.p!=null?pg(S,x.p):""}</p>`).join("")}</div>`:"").join("")}</div>`}
function pArg(S,el){const A=S.gen.arg.map((x,k)=>({...x,k})).filter(x=>!sinal(S,"a"+x.k));
  if(!est.am)est.am=shuffle(A.map(x=>x.k));
  const byK=Object.fromEntries(A.map(x=>[x.k,x])),ord=est.am.filter(k=>byK[k]);
  el.innerHTML=`<p class="lead">As frases que reconstroem o raciocínio desta seção estão embaralhadas. Diga o papel de cada uma.</p>
  <div>${ord.map(k=>{const x=byK[k];return `<div class="claim"><span class="t">${esc(x.t)}</span><div class="roles">${Object.keys(PAPEIS).map(p=>`<button class="chip" data-k="${k}" data-r="${p}" aria-pressed="${est.aa[k]===p}" ${est.aok?"disabled":""}>${PAPEIS[p]}</button>`).join("")}</div><span class="res">${est.aok?(est.aa[k]===x.r?'<b style="color:var(--ok)">Certo.</b>':`<b style="color:var(--bad)">É ${PAPEIS[x.r].toLowerCase()}.</b>`):""}</span>${est.aok?botaoSinal("a"+k):""}</div>`}).join("")}</div>
  ${est.aok?`${mapaArg(S,A)}<div class="row"><button class="btn primary" id="nx">Próxima etapa</button></div>`:`<div class="row"><button class="btn primary" id="chk" ${ord.every(k=>est.aa[k])?"":"disabled"}>Conferir</button></div>`}`;
  el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{est.aa[b.dataset.k]=b.dataset.r;pArg(S,el)});
  if($("#chk"))$("#chk").onclick=()=>{est.aok=true;const c=A.filter(x=>est.aa[x.k]===x.r).length;S.resp.arg={c,t:A.length};logEv("argumento",{est:est.id,sec:S.n,c,tt:A.length});salvarResp(S);pArg(S,el)};
  if($("#nx"))$("#nx").onclick=()=>proximoPasso(S);
  ligarSinal(S,el,()=>pArg(S,el));
}

/* 6 · Cronologia */
function pCrono(S,el){const C=S.gen.crono;
  if(!est.co)est.co=shuffle(C.map((x,i)=>i));
  const certo=C.map((x,i)=>i).sort((a,b)=>(parseInt(C[a].a)||0)-(parseInt(C[b].a)||0)||a-b);
  if(!est.cok){
    el.innerHTML=`<p class="lead">De memória: ponha os acontecimentos desta seção do mais antigo para o mais recente.</p><ol class="orderlist" id="ol"></ol><div class="row"><button class="btn primary" id="chk">Conferir</button></div>`;
    orderList($("#ol"),est.co,i=>esc(C[i].e));
    $("#chk").onclick=()=>{est.cok=true;const c=est.co.filter((v,pos)=>v===certo[pos]).length;S.resp.crono={c,t:C.length};logEv("cronologia",{est:est.id,sec:S.n,c,tt:C.length});salvarResp(S);pCrono(S,el)};
  }else{
    el.innerHTML=`<div class="fb">${S.resp.crono.c} de ${S.resp.crono.t} na posição certa. A ordem correta:</div>
    <ol class="orderlist">${certo.map((i,pos)=>`<li class="${est.co[pos]===i?"right":"wrong"}"><span class="pos">${pos+1}</span><span class="txt"><span class="yr">${esc(C[i].a)}</span>${esc(C[i].e)}${C[i].p!=null?pg(S,C[i].p):""}</span></li>`).join("")}</ol>
    ${mapaTempo(ordAno(C),S)}
    <div class="row"><button class="btn primary" id="nx">Próxima etapa</button></div>`;
    $("#nx").onclick=()=>proximoPasso(S);
  }
}

/* 7 · Glossário e notas */
function pFecho(S,el){const R=S.resp;R.gloss=arr(R.gloss);
  const sug=S.gen?S.gen.termos.filter(t=>!R.gloss.some(g=>norm(g.termo)===norm(t.termo))):[];
  const pend=R.gloss.filter(g=>!g.sentido);
  el.innerHTML=`<h2>Glossário desta seção</h2>
  ${R.gloss.length?`<ul class="gloss">${R.gloss.map((g,k)=>`<li><span class="gt"><b>${esc(g.termo)}</b>${g.sentido?": "+esc(g.sentido):' <span class="note">sem explicação ainda</span>'}${g.p!=null?pg(S,g.p):""}</span><button class="btn small" data-rm="${k}" aria-label="Tirar ${esc(g.termo)} do glossário">×</button></li>`).join("")}</ul>`:'<p class="note">Nenhum termo ainda. Os termos que você marcar na leitura aparecem aqui.</p>'}
  ${pend.length&&CAP.sample?`<div class="row"><button class="btn" id="exp">Explicar ${pend.length} termo${pend.length>1?"s":""} pelo contexto</button><span class="note" id="est"></span></div>`:""}
  ${sug.length?`<div class="stack"><p class="note">Termos que o Claude apontou nesta seção:</p><ul class="gloss">${sug.map((t,k)=>`<li><span class="gt"><b>${esc(t.termo)}</b>: ${esc(t.sentido)}${t.p!=null?pg(S,t.p):""}</span><button class="btn small" data-add="${k}">Incluir</button></li>`).join("")}</ul></div>`:""}
  <div class="field"><label for="obs">Minhas observações sobre esta seção (dúvidas, conexões com a pesquisa, o que discordo)</label><textarea id="obs">${esc(R.obs||"")}</textarea></div>
  <div class="row"><button class="btn primary" id="fim">${S.status==="concluida"?"Salvar":"Concluir a seção"}</button>${est.si<est.secoes.length-1?'<button class="btn" id="prox">Ir para a próxima seção</button>':""}</div>`;
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{R.gloss.splice(+b.dataset.rm,1);salvarResp(S);pFecho(S,el)});
  el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const t=sug[+b.dataset.add];R.gloss.push({termo:t.termo,sentido:t.sentido,p:t.p});salvarResp(S);pFecho(S,el)});
  const salvaObs=()=>{const v=$("#obs").value;if(v!==(R.obs||"")){R.obs=v;salvarResp(S)}};
  $("#obs").onblur=salvaObs;
  if($("#exp"))$("#exp").onclick=async()=>{salvaObs();$("#exp").disabled=true;$("#est").innerHTML='<span class="spin"></span>Explicando…';
    const tx=S.pars.map(p=>p.t).join("\n\n");
    try{const r=await CAP.sample.json(`Explique, em até 25 palavras cada, como o TRECHO abaixo usa cada termo da lista. Se o trecho não explica o termo, diga o sentido mais provável no contexto e comece com "Provavelmente". Responda só com JSON: [{"termo":"...","sentido":"..."}]
TERMOS: ${pend.map(g=>g.termo).join("; ")}

    const tk=t.split(/\s+/).filter(Boolean);if(tk.length>=3&&tk.filter(x=>x.length<=2).length/tk.length>=0.6)curtas++;
    ops+=(t.match(/[=⇒∴→≠≤≥±√∑∫∆Δ·×÷]/g)||[]).length;
    sobr+=(t.match(/(^|\s)[A-Za-zα-ωΔτ]\s?\d{2}(?=\s|$)|(^|\s)[a-z]\d(?=\s|$)/g)||[]).length}

- Itens na ordem de leitura. Em páginas de duas colunas, a coluna da esquerda inteira antes da direita; boxes laterais depois do texto principal. Junte palavras hifenizadas no fim da linha. Omita cabeçalhos, rodapés repetidos, números de página, avisos laterais (como "Reprodução proibida"), créditos de ilustração e orientações ao professor (anotações coloridas na margem, como "Comente com os estudantes").

{"paginas":[{"pagina":${pgs[0]},"itens":[{"tipo":"titulo","texto":"..."},{"tipo":"texto","texto":"..."},{"tipo":"formula","texto":"\\\\[ ... \\\\]"},{"tipo":"figura","texto":"...","caixa":[0.1,0.3,0.5,0.6]}],"notas":[]}]}`}

{"ideias":[{"p":1,"certa":"...","erradas":["...","..."]}],

Regras:

- formulas: de 0 a 6 fórmulas, equações, definições simbólicas ou equações químicas ESCRITAS no trecho; não invente outras. "latex" sem os delimitadores. "nome": como o trecho chama a fórmula, ou uma descrição curta. "simbolos": cada símbolo da fórmula, com o significado em palavras (sem LaTeX, até 8 palavras) e a unidade no SI ("" se não houver). "vale": quando a fórmula vale (hipóteses, condições, limites do modelo), em até 25 palavras; se o trecho não diz, use o padrão da disciplina e comece com "Em geral,". "teste": uma pergunta de múltipla escolha sobre o comportamento da fórmula (o que acontece com uma grandeza quando outra dobra, cai à metade ou muda de sinal) ou sobre quando usá-la, com duas "erradas" plausíveis.
- figuras: para cada parágrafo [FIGURA] com conteúdo (gráfico, diagrama, esquema, tabela), de 1 a 3 perguntas de múltipla escolha que exigem LER a figura (valores, inclinação, área sob a curva, sentido de setas, tendência, relação com o texto). "explica": por que a certa está certa, em até 30 palavras. Use só o que a descrição da figura e o texto permitem afirmar. Lista vazia se não houver [FIGURA].
- deducao: até 2 deduções, demonstrações ou exercícios resolvidos que ESTÃO no trecho, cada um em 3 a 7 passos na ordem correta, um passo por frase curta, com a conta em LaTeX quando houver, para o estudante reordenar. Lista vazia se não houver.
- termos: de 3 a 6 conceitos ou termos técnicos usados no trecho; "sentido" explica, em até 25 palavras, como ESTE texto usa o termo.
- "p" é sempre o número do parágrafo [Pn] de onde vem a informação.

TRECHO:
${trechoS(S)}${ns}`}

  return {ideias,lab:[],vozes:null,arg:null,crono:[],termos,formulas,figuras,deducao,desc,quando:agora()}}

const SIM_FUN={sqrt:Math.sqrt,raiz:Math.sqrt,abs:Math.abs,exp:Math.exp,ln:Math.log,log:Math.log10,

  const T=()=>{let a=U();while(pk()==="*"||pk()==="/"){const o=nx(),b=U(),x=a;a=o==="*"?v=>x(v)*b(v):v=>x(v)/b(v)}return a};
  const U=()=>{if(pk()==="-"){nx();const a=U();return v=>-a(v)}if(pk()==="+"){nx();return U()}return P()};
  const P=()=>{const a=A();if(pk()==="^"){nx();const b=U();return v=>Math.pow(a(v),b(v))}return a};
  const A=()=>{const k=nx();if(k===undefined)throw new Error("fim inesperado");
    if(/^\d/.test(k)){const n=+k;return ()=>n}
    if(k==="("){const a=E();need(")");return a}
    if(/^[A-Za-z_]/.test(k)){if(pk()==="("){const f=SIM_FUN[k];if(!f)throw new Error("função "+k);nx();const a=E();need(")");return v=>f(a(v))}
      if(k==="pi")return ()=>Math.PI;if(!ids.includes(k))throw new Error("variável "+k);return v=>v[k]}
    throw new Error("símbolo "+k)};

  ligarMapaErros(S,el);

    st.busy=true;st.err=null;st.ctl=new AbortController();pResolver(S,el);

/* --- "Mais uma igual": questão parecida, começando sem dicas --- */
const NIVEL_VAR={1:"outros números",2:"outro contexto",3:"pergunta invertida"};
const NIVEL_VAR_DESC={1:"Mesma situação, outros valores. Confirma o procedimento.",2:"Mesmo conceito numa situação nova. Confirma que você reconhece quando usar.",3:"A mesma situação, pedindo outra grandeza. Confirma que você entende a relação, nos dois sentidos."};
function blocoParecida(x){if(!CAP.sample)return "";const sug=x.direta&&x.direta.av==="certa"?Math.min(3,(x.var?x.var.nivel:0)+1):x.var?x.var.nivel:1;
  return `<div class="panel stack"><b>Tentar uma parecida</b><p class="note">A parecida começa sem dicas: você tenta a resposta final direto. Se travar, ela vira resolução por etapas.${(dicasUsadas(x)>2||x.et.some(E=>E&&E.viu))&&!x.var?" Depois de tantas dicas, comece pelos outros números.":""}</p>

    <p class="note" id="vst"></p></div>`}
function promptVariacao(S,x,nivel){const pf=perfilAtual(),P=x.plano;
  const regra={1:"mesma estrutura e mesmo contexto, com outros valores numéricos (escolha valores que deem contas razoáveis à mão)",
    2:"mesmo conceito e mesmo tipo de raciocínio, numa situação diferente, de preferência do cotidiano do estudante",
    3:"a mesma situação, mas pedindo outra grandeza: o que era dado vira o que se pede (por exemplo, dada a velocidade, pedir o tempo)"}[nivel];
  return `Você cria uma questão parecida para um estudante de ${PERFIS[pf]} que acabou de resolver a questão abaixo com ajuda. O objetivo é ver se ele aprendeu o caminho.
A questão nova deve ser: ${regra}. Não copie a original. Use valores realistas. Resolva a questão nova você mesmo, com cuidado, e confira a resposta antes de responder.
Use o TRECHO do livro como base teórica.
Divida a resolução em 3 a 6 etapas pequenas, como na original. Para cada etapa: "pergunta" curta, sem entregar a resposta; "esperado" é a resposta correta; "dicas" são três dicas graduais (a primeira só aponta a direção, a terceira quase entrega a etapa).
${LATEX_REGRA}

Responda apenas com JSON neste formato:
{"enunciado":"...","pede":"...","etapas":[{"titulo":"...","pergunta":"...","esperado":"...","dicas":["...","...","..."]}],"resposta":"...","conferir":{"unidade":"...","ordem":"...","limite":"..."},"p":3,"fora_do_trecho":""}

${P.enun||x.enun}
RESPOSTA DA ORIGINAL: ${P.resp}

${trechoS(S)}`}
function promptFinal(x,resp){const P=x.plano;

{"avaliacao":"certa","retorno":"...","erro":"nenhum"}

/* --- Mapa de erros: os tipos de erro do Resolver junto, no estudo inteiro --- */
const TIPOS_ERRO={unidade:["Unidades","esquecer a unidade, trocar ou não converter (km/h e m/s, g e kg)"],
  sinal:["Sinais","sinal trocado: sentido, trabalho negativo, referencial, menos de uma subtração"],
  conta:["Contas","frações, potências de 10, arredondamento, isolar a incógnita"],
  conceito:["Conceitos","usar a lei, a definição ou a fórmula errada para a situação"],
  leitura:["Leitura do enunciado","dado ignorado, grandeza pedida trocada, situação mal interpretada"],
  incompleta:["Respostas incompletas","parar no meio, faltar parte do que foi pedido"]};
const MIN_ERROS=8;
function errosDoEstudo(){const cnt={},ult={};let conf=0,certas=0;
  const ver=(h,q)=>{conf++;if(h.av==="certa"){certas++;return}if(TIPOS_ERRO[h.erro]){cnt[h.erro]=(cnt[h.erro]||0)+1;ult[h.erro]=q}};
  for(const S of arr(est.secoes))for(const x of arr(S.resp&&S.resp.resolv)){if(!x)continue;

  const lista=Object.keys(cnt).map(k=>({k,n:cnt[k],ex:ult[k]})).sort((a,b)=>b.n-a.n);

function cartoesCiencias(S,R,g,base,id,onde,pgi){const out=[];
  if(R.formulas)arr(g.formulas).forEach((F,k)=>{if(sinal(S,"f"+k))return;
    out.push({id:`${base}:f:${norm(F.latex).slice(0,40)}`,est:id,sec:S.n,tipo:"Fórmula",onde,pg:pgi(F.p),
      frente:`<p>Escreva de memória: <b>${esc(F.nome)}</b>.</p><p class="note">O que significa cada símbolo? Quando ela vale?</p>`,
      verso:`<div class="eq">\\[${esc(F.latex)}\\]</div><ul>${F.simb.map(z=>`<li>\\(${esc(z.s)}\\): ${esc(z.m)}${z.u?` (${esc(z.u)})`:""}</li>`).join("")}</ul>${F.vale?`<p class="note">${esc(F.vale)}</p>`:""}`,
      texto:S.pars[F.p]?S.pars[F.p].t:""})});
  if(R.deducao)arr(g.deducao).forEach((D,k)=>{if(sinal(S,"d"+k))return;
    out.push({id:`${base}:d${k}`,est:id,sec:S.n,tipo:"Passo a passo",onde,pg:pgi(D.p),frente:`<p>Quais são os passos de <b>${esc(D.titulo)}</b>?</p>`,
      verso:`<ol>${D.passos.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>`,texto:S.pars[D.p]?S.pars[D.p].t:""})});
  return out}

const AVV={completa:1,parcial:.5,incompleta:0};
const COMP_ROT={ide:"Ideia central",formulas:"Fórmulas",figuras:"Figuras",deducao:"Passo a passo",resolv:"Resolver junto",perg:"Compreensão",teste:"Teste"};
function indicesDe(secoes,meta){const soma={ide:[0,0],formulas:[0,0],figuras:[0,0],deducao:[0,0],resolv:[0,0],perg:[0,0]};let cal=[],il=0,sub=0,eu=0,ia=0,mi=0;
  for(const S of secoes){const R=S.resp||{};
    Object.values(R.ide||{}).forEach(v=>{soma.ide[1]++;if(v)soma.ide[0]++});
    ["formulas","figuras","deducao"].forEach(k=>{const x=R[k];if(x&&x.t){soma[k][0]+=x.c||0;soma[k][1]+=x.t}});
    {const x=indiceResolver(R);if(x.t){soma.resolv[0]+=x.c;soma.resolv[1]+=x.t}}
    Object.values(R.perg||{}).forEach(a=>{if(!a||!(a.av in AVV))return;const v=AVV[a.av];soma.perg[0]+=v;soma.perg[1]++;
      if(a.conf>=1&&a.conf<=3){const esp=(a.conf-1)/2;cal.push(Math.abs(esp-v));if(a.conf===3&&v<1)il++;if(a.conf===1&&v===1)sub++}});
    const eo=R.eorig||{};Object.keys(R.etq||{}).forEach(i=>{if(!R.etq[i])return;const o=eo[i]||"eu";if(o==="ia")ia++;else if(o==="misto")mi++;else eu++})}
  const partes={};Object.entries(soma).forEach(([k,[c,t]])=>{if(t)partes[k]={c:Math.round(c*10)/10,t,p:Math.round(100*c/t)}});
  const R0=(meta&&meta.resultados)||{},tf=R0.tardio||R0.pos;if(tf&&tf.t)partes.teste={c:tf.c,t:tf.t,p:Math.round(100*tf.c/tf.t),fase:R0.tardio?"tardio":"pos"};
  const ks=Object.keys(partes),comp=ks.length?Math.round(ks.reduce((s,k)=>s+partes[k].p,0)/ks.length):null;
  const calib=cal.length?{p:Math.round(100*(1-cal.reduce((a,b)=>a+b,0)/cal.length)),n:cal.length,ilusao:il,subestima:sub}:null;
  const net=eu+ia+mi,auton=net?{p:Math.round(100*(eu+mi*.5)/net),n:net,ia,misto:mi}:null;
  const feitas=secoes.filter(S=>S.status==="concluida").length;
  return {comp,partes,calib,auton,feitas,total:secoes.length}}
function faixaComp(p){return p==null?"":p>=80?"muito bom":p>=60?"bom":p>=40?"em construção":"inicial"}
function graficoRodadas(pts){if(pts.length<2)return "";const W=320,H=120,pl=28,pr=10,pt=10,pb=22,n=pts.length;
  const x=i=>pl+(n===1?0:i*(W-pl-pr)/(n-1)),y=v=>pt+(100-v)*(H-pt-pb)/100;
  const ser=(k,cls)=>{const ps=pts.map((p,i)=>p[k]==null?null:[x(i),y(p[k])]).filter(Boolean);if(ps.length<1)return "";
    return `<polyline class="${cls}" fill="none" points="${ps.map(q=>q.join(",")).join(" ")}"/>${ps.map(q=>`<circle class="${cls}" cx="${q[0]}" cy="${q[1]}" r="3"/>`).join("")}`};
  return `<figure class="rgraf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do índice de compreensão por rodada">
    ${[0,50,100].map(v=>`<line class="rg-l" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="rg-t" x="${pl-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("")}
    ${pts.map((p,i)=>`<text class="rg-t" x="${x(i)}" y="${H-6}" text-anchor="middle">${p.rot}</text>`).join("")}
    ${ser("calib","rg-cal")}${ser("comp","rg-comp")}</svg>
    <figcaption class="note rg-leg"><span><span class="rg-k rg-kc"></span>Compreensão</span><span><span class="rg-k rg-kl"></span>Calibração</span></figcaption></figure>`}

  ${hist.length?`<h3 class="subtitle">Rodadas deste material</h3>${graficoRodadas(pts)}

function fichDados(){return est.secoes.map(S=>{const R=S.resp||{},g=S.gen||{},etq=R.etq||{};
  const nome=g.vozes?Object.fromEntries(g.vozes.lista.map(x=>[x.id,x.nome])):{};
  return {S,resumo:corpo(S).filter(i=>etq[i]).map(i=>({t:etq[i],pg:S.pars[i].pg})),
    arg:g.arg?g.arg.filter((x,k)=>!sinal(S,"a"+k)):null,
    rel:g.vozes?g.vozes.rel.map(r=>({n:nome[r.v],r:r.r,t:r.t})):[],
    crono:arr(g.crono),gloss:arr(R.gloss).filter(x=>x.sentido),obs:(R.obs||"").trim(),perg:arr(S.perg).map((q,k)=>({q,a:(R.perg||{})[k]})).filter(x=>x.a&&x.a.r)}})}
const pgOf=(S,i)=>i!=null&&S.pars[i]?` (p. ${S.pars[i].pg})`:"";
function fichMD(){const m=est.meta,D=fichDados();let o=`# Fichamento: ${m.titulo}\n\n`;
  if(m.ref)o+=`${m.ref}\n\n`;o+=`${m.paginasEstimadas?"Páginas estimadas (texto sem paginação)":`Páginas ${m.pgIni}–${m.pgFim} do PDF`} · ${new Date().toLocaleDateString("pt-BR")}\n\n## Síntese (nas minhas palavras)\n\n${(m.sintese||"").trim()||"(a escrever)"}\n\n`;
  D.forEach((d,n)=>{const S=d.S;o+=`## ${n+1}. ${S.titulo} (p. ${S.pgIni}–${S.pgFim})\n\n`;
    if(d.resumo.length)o+=`### Resumo nas minhas palavras\n\n${d.resumo.map(x=>`- ${x.t} (p. ${x.pg})`).join("\n")}\n\n`;
    if(d.arg){o+=`### Argumento\n\n`;["tese","premissa","evidencia","conclusao"].forEach(r=>{const it=d.arg.filter(x=>x.r===r);if(it.length)o+=`**${it.length>1?plural(PAPEIS[r]):PAPEIS[r]}**\n\n${it.map(x=>`- ${x.t}${pgOf(S,x.p)}`).join("\n")}\n\n`})}
    if(d.rel.length)o+=`### Interlocutores\n\n${d.rel.map(x=>`- **${x.n}** (${x.r}): ${x.t}`).join("\n")}\n\n`;
    if(d.crono.length)o+=`### Cronologia\n\n${d.crono.slice().sort((a,b)=>(parseInt(a.a)||0)-(parseInt(b.a)||0)).map(x=>`- ${x.a}: ${x.e}${pgOf(S,x.p)}`).join("\n")}\n\n`;
    if(d.perg.length)o+=`### Compreensão\n\n${d.perg.map(x=>`- **${x.q.q}** (${NIVEL[x.q.n].toLowerCase()}): ${x.a.r}`).join("\n")}\n\n`;
    if(d.gloss.length)o+=`### Glossário\n\n${d.gloss.map(x=>`- **${x.termo}**: ${x.sentido}${pgOf(S,x.p)}`).join("\n")}\n\n`;
    if(d.obs)o+=`### Observações\n\n${d.obs}\n\n`});
  return o+"---\nArgumento, interlocutores e glossário foram preparados com ajuda do Claude a partir do texto. Confira no original antes de citar.\n"}
function mdHTML(md){const lines=md.split("\n"),out=[];let ul=false;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  for(const l of lines){if(/^- /.test(l)){if(!ul){out.push("<ul>");ul=true}out.push(`<li>${inl(l.slice(2))}</li>`);continue}
    if(ul){out.push("</ul>");ul=false}
    if(/^### /.test(l))out.push(`<h3>${inl(l.slice(4))}</h3>`);else if(/^## /.test(l))out.push(`<h2>${inl(l.slice(3))}</h2>`);else if(/^# /.test(l))out.push(`<h1>${inl(l.slice(2))}</h1>`);
    else if(l==="---")out.push("<hr>");else if(l.trim())out.push(`<p>${inl(l)}</p>`)}
  if(ul)out.push("</ul>");return out.join("\n")}

  <div class="subtabs"><button class="chip" data-fv="txt" aria-pressed="true">Fichamento</button><button class="chip" data-fv="map" aria-pressed="false">Mapas</button></div>
  <div class="row"><button class="btn primary" id="md">Baixar .md</button><button class="btn" id="ht">Baixar .html (abre no Word)</button><button class="btn" id="mp">Baixar os mapas (.html)</button><button class="btn" id="cp">Copiar o texto</button></div>
  <div class="fich" id="fv"></div><div class="stack" id="fmap" hidden></div>`;
  main.querySelectorAll("[data-fv]").forEach(b=>b.onclick=()=>{const map=b.dataset.fv==="map";main.querySelectorAll("[data-fv]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    $("#fv").hidden=map;$("#fmap").hidden=!map;if(map)$("#fmap").innerHTML=mapaEstudo()+(est.secoes.map(mapasSecao).join("")||vazio("Os mapas de argumento, vozes e linha do tempo aparecem depois que as seções têm exercícios preparados."))});
  const pinta=()=>{$("#fv").innerHTML=mdHTML(fichMD())};pinta();
  $("#bk").onclick=()=>estGo("estudo");
  $("#sin").onblur=()=>{const v=$("#sin").value;if(v!==(m.sintese||"")){m.sintese=v;qw("meta",()=>mRef(est.id).update({sintese:v,atualizado:agora()}));pinta()}};
  const nomeArq=(m.titulo||"fichamento").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim().slice(0,80)||"fichamento";
  const baixar=async(ext,data)=>{if(!CAP.dl){toast("Download indisponível aqui. Use “Copiar o texto”.");return}
    try{await CAP.dl.save({filename:`Fichamento - ${nomeArq}.${ext}`,data})}catch(e){if(e&&e.code!=="declined")toast("Não foi possível baixar o arquivo. Use “Copiar o texto”.")}};
  $("#md").onclick=()=>{m.sintese=$("#sin").value;baixar("md",fichMD())};
  $("#ht").onclick=()=>{m.sintese=$("#sin").value;baixar("html",`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc("Fichamento - "+m.titulo)}</title><style>body{font-family:Georgia,serif;max-width:46rem;margin:2rem auto;padding:0 1rem;line-height:1.6;color:#1a1a1a}h1,h2,h3{font-family:Arial,sans-serif}h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:#555}hr{margin:2rem 0}</style></head><body>${mdHTML(fichMD())}</body></html>`)};
  $("#mp").onclick=async()=>{if(!CAP.dl){toast("Download indisponível aqui.");return}try{await CAP.dl.save({filename:`Mapas - ${nomeArq}.html`,data:mapasHTMLDoc()})}catch(e){if(e&&e.code!=="declined")toast("Não foi possível baixar os mapas.")}};
  $("#cp").onclick=()=>{m.sintese=$("#sin").value;const t=fichMD();
    navigator.clipboard.writeText(t).then(()=>toast("Fichamento copiado."),()=>{const a=document.createElement("textarea");a.value=t;a.setAttribute("aria-label","Fichamento em texto");main.appendChild(a);a.select();toast("Selecionei o texto abaixo. Copie com Ctrl+C.")})};
}

/* ---------------- Relógio da sessão e tamanho da letra ---------------- */
let secs=0,run=false,clk=null;
function showClock(){$("#clock").textContent=String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0")}
$("#clockBtn").onclick=()=>{
  if(run){clearInterval(clk);run=false;$("#clockBtn").textContent=secs?"Continuar":"Iniciar sessão";return}
  run=true;$("#clockBtn").textContent="Pausar";
  clk=setInterval(()=>{secs++;showClock();if(secs===1200)$("#pause").hidden=false;if(secs===1500)$("#pause").hidden=true},1000);
};
$("#clock").ondblclick=()=>{secs=0;showClock();$("#pause").hidden=true};
$("#aa").onclick=()=>abrirPnl($("#pnl").hidden);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#pnl").hidden)abrirPnl(false)});
aplicarPref();go();initCaps();
</script>
</body>
</html>
